/* ========================================================= AZIONI (delega eventi) */
document.addEventListener("click",e=>{
  if(e.target.closest("a[href]")) return;
  const el=e.target.closest("[data-az]"); if(!el) return;
  if(el.tagName==="BUTTON"&&el.type==="submit"&&el.form) return;
  e.preventDefault();
  const inPop=!!el.closest("#popover"), tieni=["filtri","notifiche","menuUtente","menuCliente"].includes(el.dataset.az);
  azione(el.dataset.az,el.dataset,el).catch(err=>{ console.error(err); toast("Operazione non riuscita: "+err.message,"err"); }).finally(()=>{ if(inPop&&!tieni&&el.dataset.az!=="azzeraFiltri") chiudiPopover(); });
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.campo&&vista.bozza){ scrivi(vista.bozza,t.dataset.campo,t.value); if(!vista.sporco){ vista.sporco=true; $("#barraSalva")?.removeAttribute("hidden"); } return; }
  if(t.id==="cercaGlobale"){ const q=t.value.trim(); if(!q){ chiudiPopover(); return; } apriPopover(t.parentElement,risultatiRicerca(q),{focus:false,allinea:"sinistra"}); $("#popover")._anchor=t; return; }
  if(t.dataset.filtro==="q"){ fc.q=t.value; fc.pag=1; aggiornaTabellaClienti(); return; }
  if(t.dataset.filtroLav==="q"){ fs.q=t.value; rerenderFocus("cercaLav"); return; }
  if(t.dataset.filtroGl==="q"){ fl.q=t.value; rerenderFocus("cercaGl"); return; }
  if(t.dataset.filtroReg==="q"){ fr.q=t.value; rerenderFocus("cercaReg"); return; }
});
document.addEventListener("change",e=>{
  const t=e.target, v=t.type==="checkbox"?t.checked:t.value;
  if(t.dataset.docCat){ const c=clienteDa(vista.id), x=c?.documenti.find(y=>y.id===t.dataset.docCat); if(!x) return; const prima=catDoc(x); if(prima===t.value) return;
    x.categoria=t.value; registra("documento","Tipo di documento cambiato",`${x.nome}: ${prima} → ${t.value}`,{clienteId:c.id,riferimento:x.id}); salva().then(()=>toast("Tipo aggiornato")); return; }
  if(t.dataset.filtro&&t.dataset.filtro!=="q"){ fc[t.dataset.filtro]=v; fc.pag=1; if(t.dataset.filtro==="ord") fc.dir=(v==="lavori"||v==="ultima")?-1:1; render(); }
  else if(t.dataset.filtroLav&&t.dataset.filtroLav!=="q"){ fs[t.dataset.filtroLav]=v; render(); }
  else if(t.dataset.filtroGl&&t.dataset.filtroGl!=="q"){ fl[t.dataset.filtroGl]=v; render(); }
  else if(t.dataset.filtroReg&&t.dataset.filtroReg!=="q"){ fr[t.dataset.filtroReg]=v; render(); }
});
function rerenderFocus(id){ const el=$("#"+id), p=el?.selectionStart; render(); const n=$("#"+id); if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} } }
document.addEventListener("dragover",e=>{ const z=e.target.closest?.("#zonaFile"); if(z){ e.preventDefault(); z.classList.add("sopra"); } });
document.addEventListener("dragleave",e=>{ e.target.closest?.("#zonaFile")?.classList.remove("sopra"); });
document.addEventListener("drop",e=>{ const z=e.target.closest?.("#zonaFile"); if(!z) return; e.preventDefault(); z.classList.remove("sopra");
  const dest=z.dataset.dest==="azienda"?{tipo:"azienda"}:{tipo:"cliente",id:vista.id};
  vociDaTrascinamento(e.dataTransfer).then(({voci,cartella})=>{ if(!voci.length) return;
    if(cartella||dest.tipo==="azienda") return anteprimaCartella(voci,dest);
    const c=clienteDa(vista.id); if(c) return aggiungiDocumenti(c,voci).then(()=>render());
  }).catch(err=>toast("Non riesco a leggere i file trascinati: "+err.message,"err")); });
$("#fileCartella").addEventListener("change",e=>{ const v=vociDaInput(e.target.files); e.target.value=""; if(v.length&&stato.destCartella) anteprimaCartella(v,stato.destCartella); });
$("#fileDoc").addEventListener("change",async e=>{ const c=clienteDa(vista.id); const f=[...e.target.files]; e.target.value=""; e.target.removeAttribute("accept");
  const pend=stato.allegaLav; stato.allegaLav=null; if(!c||!f.length) return;
  if(pend){ const l=c.lavori.find(x=>x.id===pend.lavId); const docs=await aggiungiDocumenti(c,f,pend.lavId,false,{categoria:pend.cat});
    if(l&&docs.length){ l.allegati.push(...docs.map(d=>d.id)); await salva(); toast("Documento allegato al lavoro"); } render(); dettaglioLavoro(pend.lavId); return; }
  await aggiungiDocumenti(c,f); render(); });
$("#fileImport").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const cand=await leggiFileCandidato(f); if(!db){ db=archivioVuoto(); sessione.utente=db.utenti[0]; stato._daBenvenuto=true; } await anteprimaRipristino(cand); }
  catch(err){ mostraErrore({titolo:"Questo file non si può usare",cosa:err.message,dati:"Nessuno: i dati attuali non sono stati toccati.",disponibili:"Sì.",azioni:[{t:"Scegli un altro file",az:"importaFile",primario:true}]}); }
  finally{ if(stato._daBenvenuto&&db&&!db.clienti.length&&!stato.salv.ts){ db=null; sessione.utente=null; stato._daBenvenuto=false; } }
});

      break; }
    case "caricaFoto": stato.allegaLav=null; $("#fileDoc").setAttribute("accept","image/*"); $("#fileDoc").click(); break;
    case "aiuto": apriModale(`${testaModale("Come fare per…")}<ol class="guida">
      <li><b>Trovare un cliente</b>: scrivi nella barra in alto (o premi <kbd>/</kbd>) e premi Invio sul risultato.</li>
      <li><b>Registrare un lavoro</b>: apri il cliente › <i>Registra lavoro</i>. Resta nello storico e non sovrascrive i precedenti; se lo modifichi, la versione prima viene conservata. Il rapporto tecnico e la dichiarazione di conformità hanno una casella ciascuno: nello storico li riconosci dalle sigle <b>RT</b> e <b>DiCo</b>.</li>
      <li><b>Portare dentro la cartella di un cliente</b>: apri il cliente › <i>Documenti</i> › trascina la cartella che hai sul desktop. Gli originali restano dove sono.</li>

      <li><b>Sapere se i dati sono al sicuro</b>: guarda il riquadro <i>I Miei Dati</i>. È verde solo quando tutti i controlli sono stati eseguiti e superati; se è arancione ti dice cosa sistemare.</li>
      <li><b>Portare via tutto l'archivio</b>: <i>Esporta tutti i miei dati</i> crea un .zip con Excel, CSV, JSON, documenti originali e istruzioni.</li>

      <li><b>Aggiornare il programma</b>: sostituisci questo file con la versione nuova e aprilo. I dati restano: all'apertura viene fatta e verificata una copia, poi si controlla che non manchi nulla.</li>
      <li><b>PIN dimenticato</b>: nella schermata di accesso usa il codice di recupero.</li></ol>

    case "modificaCliente": vai(`cliente/${d.id}/anagrafica`); break;
    case "ordina": if(fc.ord===d.k) fc.dir*=-1; else { fc.ord=d.k; fc.dir=d.k==="lavori"||d.k==="ultima"?-1:1; } render(); break;

      x.archiviato=a==="archiviaCliente"; x.archiviatoIl=x.archiviato?adesso():null;
      registra("cliente",x.archiviato?"Cliente archiviato":"Cliente riattivato",nomeCliente(x),{clienteId:x.id});
      await salva(); toast(x.archiviato?"Cliente archiviato: lo storico resta conservato":"Cliente riattivato"); render(); break; }
    case "eliminaCliente": {
      const ok=await chiedi({titolo:`Eliminare definitivamente ${nomeCliente(c)}?`,pericolo:true,ok:"Elimina definitivamente",digita:"ELIMINA",
        testo:`<p>Verranno tolti dall'archivio il cliente, le sue ${c.lavori.length} lavori, ${c.documenti.length} documenti e ${c.noteDiario.length} note.</p><p>Prima dell'eliminazione viene creata una copia di sicurezza verificata: potrai ancora recuperarlo da I miei dati › Ripristino.</p>`});
      if(!ok) break;
      const bk=await creaBackup("pre-eliminazione",`Prima di eliminare ${nomeCliente(c)}`);
      if(!bk.verifica.ok){ mostraErrore({titolo:"Eliminazione fermata",cosa:"Non è stato possibile creare una copia di sicurezza verificata.",dati:nomeCliente(c),disponibili:"Sì, il cliente non è stato eliminato.",azioni:[]}); break; }
      db.clienti=db.clienti.filter(x=>x.id!==c.id);
      registra("cliente","Cliente eliminato",`${nomeCliente(c)} (${c.lavori.length} lavori, ${c.documenti.length} documenti). Copia di sicurezza: ${dataOra(bk.ts)}`,{clienteId:c.id});
      vista.sporco=false; await salva(); toast("Cliente eliminato. Recuperabile dalla copia di sicurezza"); vai("clienti"); break; }
    case "salvaAnagrafica": await salvaAnagrafica(); break;
    case "annullaAnagrafica": vista.bozza=JSON.parse(JSON.stringify(c)); vista.sporco=false; render(); toast("Modifiche annullate"); break;
    case "nuovaLavorazione": formLavoro(null); break;
    case "dettaglioLav": dettaglioLavoro(d.id); break;
    case "modificaLav": formLavoro(c.lavori.find(l=>l.id===d.id)); break;
    case "eliminaLav": {
      const l=c.lavori.find(x=>x.id===d.id);
      if(!await chiedi({titolo:"Eliminare questo lavoro?",testo:`<p><b>${esc(l.tipo)}</b> del ${dataIt(l.data)}.</p><p>Non sparisce: viene spostato tra i lavori eliminati di questo cliente e puoi ripristinarlo in qualsiasi momento.</p>`,ok:"Elimina",pericolo:true})) break;
      l.eliminato=true; l.modificato=adesso(); l.modificatoDa=nomeOp();
      registra("lavorazione","Lavoro eliminato",`${l.tipo} del ${dataIt(l.data)} per ${nomeCliente(c)}`,{clienteId:c.id,riferimento:l.id});
      await salva(); toast("Lavoro eliminato (ripristinabile)"); render(); break; }
    case "ripristinaLav": {
      const l=c.lavori.find(x=>x.id===d.id); l.eliminato=false; l.modificato=adesso(); l.modificatoDa=nomeOp();

    case "filtroDoc": fdoc.cat=d.cat||""; render(); break;

      const b=await creaBackup("manuale","Backup manuale");
      registra("dati","Backup manuale",`Copia ${b.verifica.ok?"creata e verificata":"creata ma NON verificata"} (${formatoByte(b.dimensione)})`); await salva();
      if(b.verifica.ok) toast("Backup creato e verificato"); else mostraErrore({titolo:"Il backup non ha superato la verifica",cosa:b.verifica.dettagli.filter(x=>!x.esito).map(x=>`${x.lab}: ${x.msg}`).join("; "),dati:"La nuova copia di sicurezza.",disponibili:"Sì: l'archivio in uso non è stato toccato, e le copie precedenti verificate restano disponibili.",azioni:[{t:"Riprova",az:"creaBackup",primario:true}]});
      await eseguiControlli(false); render(); break; }
    case "verificaTutti": {
      el.disabled=true; el.innerHTML=ic("loader")+" Verifica…";
      const bks=await elencoBackup(); let ko=0; for(const b of bks){ const v=await verificaBackup(b.id); if(!v.ok) ko++; }
      toast(ko?`${ko} copie su ${bks.length} non superano la verifica`:`Tutte le ${bks.length} copie sono verificate`,ko?"err":"ok"); await eseguiControlli(false); render(); break; }
    case "dettagliBackup": {
      const b=await idbGet("backup",d.id);
      apriModale(`${testaModale(`Backup del ${dataOra(b.ts)}`)}<div class="dettaglio"><dl><dt>Tipo</dt><dd>${esc(b.motivo||b.tipo)}</dd><dt>Creato da</dt><dd>${esc(b.operatore||"")}</dd><dt>Dimensione</dt><dd>${formatoByte(b.dimensione)}</dd><dt>Impronta</dt><dd style="font-family:var(--mono);font-size:12px">${esc(b.hash)}</dd><dt>Programma</dt><dd>${esc(b.appVersion)} · struttura v${b.schema}</dd></dl></div>
        <h3 style="margin-top:16px">Esito della verifica ${b.verifica?`(${dataOra(b.verifica.ts)})`:""}</h3>
        <ul class="passi">${(b.verifica?.dettagli||[]).map(x=>`<li class="${x.esito?"ok":"errore"}">${ic(x.esito?"check-c":"x-c")}<div><b>${esc(x.lab)}</b><small>${esc(x.msg)}</small></div></li>`).join("")||"<li>Non ancora verificata</li>"}</ul>
        <div class="modale-piede"><button class="btn sx" data-az="scaricaBackup" data-id="${b.id}">${ic("download")}Scarica questa copia</button><button class="btn" data-az="riverifica" data-id="${b.id}">${ic("refresh")}Verifica di nuovo</button>${puo("ripristina")?`<button class="btn primario" data-az="anteprimaBackup" data-id="${b.id}">Ripristina…</button>`:""}</div>`,{larga:true});
      break; }
    case "riverifica": { const v=await verificaBackup(d.id); toast(v.ok?"Copia verificata":"La copia non supera la verifica",v.ok?"ok":"err"); await azione("dettagliBackup",d); riempiBackup(); break; }
    case "scaricaBackup": {
      const b=await idbGet("backup",d.id); const dati=JSON.parse(b.json); const out=dati.schema>=2?senzaCredenziali(dati):dati; out._allegati={};
      for(const h of b.allegati||[]){ const x=await idbGet("allegati",h); if(x) out._allegati[h]={nome:x.nome,tipo:x.tipo,base64:bufToB64(await x.blob.arrayBuffer())}; }
      scarica(`backup-gestionale-${b.ts.slice(0,10)}-${b.id.slice(-4)}.json`,new Blob([JSON.stringify(out)],{type:"application/json"})); toast("Copia scaricata"); break; }
    case "anteprimaBackup": { if(!puo("ripristina")) break; chiudiModale(); const cand=await candidatoDaBackup(d.id); await anteprimaRipristino(cand); break; }
    case "importaFile": chiudiModale(); $("#fileImport").click(); break;
    case "apriDaCartella": {
      try{ const cand=await candidatoDaCartella(); if(!db){ db=archivioVuoto(); sessione.utente=db.utenti[0]; } await anteprimaRipristino(cand); }
      catch(err){ if(err.name!=="AbortError") mostraErrore({titolo:"Cartella non utilizzabile",cosa:err.message,dati:"Nessuno: i dati attuali non sono stati toccati.",disponibili:"Sì.",azioni:[]}); }
      break; }
    case "collegaCartella": {
      try{
        const h=await window.showDirectoryPicker({id:"gestionale-archivio",mode:"readwrite"});
        Object.assign(stato.cartella,{handle:h,nome:h.name,permesso:"granted",errore:null,ultima:null});
        await idbPut("kv",h,"cartella");
        const ok=await scriviCartella();
        registra("dati","Cartella collegata",`Copia automatica nella cartella «${h.name}»`); await salva();
        toast(ok?`Cartella «${h.name}» collegata e verificata`:"Cartella collegata, ma la prima scrittura non è riuscita",ok?"ok":"err");
        await eseguiControlli(false); render();
      }catch(err){ if(err.name!=="AbortError") toast("Cartella non collegata: "+err.message,"err"); }
      break; }
    case "riattivaCartella": {
      try{ const p=await stato.cartella.handle.requestPermission({mode:"readwrite"}); stato.cartella.permesso=p;
        if(p==="granted"){ await scriviCartella(); toast("Cartella riattivata e aggiornata"); } else toast("Permesso non concesso","err");
      }catch(err){ toast("Non è stato possibile riattivare la cartella","err"); }
      await eseguiControlli(false); render(); break; }
    case "scriviCartellaOra": { const ok=await scriviCartella(); toast(ok?"Cartella aggiornata e verificata":"Scrittura non riuscita: "+stato.cartella.errore,ok?"ok":"err"); await eseguiControlli(false); render(); break; }
    case "scollegaCartella": {
      if(!await chiedi({titolo:"Scollegare la cartella?",testo:`<p>Il programma smetterà di aggiornare «${esc(stato.cartella.nome)}». I file già presenti nella cartella restano dove sono.</p>`,ok:"Scollega"})) break;
      await idbDel("kv","cartella"); await idbDel("kv","cartellaStato");
      registra("dati","Cartella scollegata",stato.cartella.nome); Object.assign(stato.cartella,{handle:null,nome:"",permesso:null,ultima:null,errore:null}); await salva(); await eseguiControlli(false); render(); break; }
    case "chiediPersistenza": { let ok=false; try{ ok=await navigator.storage.persist(); }catch(e){} toast(ok?"Protezione attivata":"Il browser non l'ha concessa: tieni comunque una copia fuori dal browser",ok?"ok":"err"); await eseguiControlli(false); render(); break; }
    case "ricontrolla": { el.disabled=true; el.innerHTML=ic("loader")+" Controllo in corso…"; await eseguiControlli(true); toast("Controlli completati"); render(); break; }
    case "modificaUtente": formUtente(d.id); break;
    case "nuovoRecupero": if(await chiedi({titolo:"Generare un nuovo codice di recupero?",testo:"<p>Il codice precedente smetterà di funzionare.</p>",ok:"Genera"})) await mostraCodiceRecupero(); break;
    case "esci": if(vista.sporco&&await chiediUscita()==="resta") break; registra("accesso","Uscita",`${nomeOp()} ha chiuso la sessione`); await salva(); sessione.utente=null; vLogin(); break;
    case "loginScegli": { const u=db.utenti.find(x=>x.id===d.id); if(u&&!u.pinHash) entra(u); else vLogin(d.id||null); break; }
    case "recuperaPin": recuperaPin(d.id); break;
    case "svuota": {
      const ok=await chiedi({titolo:"Svuotare l'archivio?",pericolo:true,ok:"Svuota archivio",digita:"SVUOTA",testo:`<p>Verranno tolti ${db.clienti.length} clienti con tutte le lavorazioni, i documenti e le note.</p><p>Prima viene creata una copia di sicurezza verificata, ripristinabile da I miei dati › Ripristino.</p>`});
      if(!ok) break;
      const bk=await creaBackup("pre-svuota","Prima di svuotare l'archivio"); if(!bk.verifica.ok){ toast("Copia di sicurezza non verificata: operazione fermata","err"); break; }
      const n=db.clienti.length; db.clienti=[]; registra("dati","Archivio svuotato",`Tolti ${n} clienti. Copia di sicurezza del ${dataOra(bk.ts)}`);
      await salva(); toast("Archivio svuotato. La copia di sicurezza è nei backup"); vai("clienti"); break; }
    case "demo": {
      if(db&&db.clienti.length&&!await chiedi({titolo:"Caricare i dati di esempio?",testo:"<p>L'archivio attuale viene sostituito dai clienti di prova. Prima viene creata una copia di sicurezza.</p>",ok:"Carica esempio"})) break;
      if(db&&db.clienti.length){ const bk=await creaBackup("pre-ripristino","Prima di caricare i dati di esempio"); if(!bk.verifica.ok){ toast("Copia di sicurezza non verificata: operazione fermata","err"); break; } }
      const demo=migra(datiDemoV1());
      if(!db){ db=demo; sessione.utente=db.utenti[0]; } else { db.clienti=demo.clienti; }
      registra("dati","Dati di esempio","Caricati 4 clienti di prova"); await salva(); avviaApp(); vai("clienti"); toast("Dati di esempio caricati"); break; }
    case "nuovoArchivio": db=archivioVuoto(); sessione.utente=db.utenti[0]; registra("dati","Archivio creato","Nuovo archivio vuoto"); await salva(); avviaApp(); vai("clienti"); break;
    case "scaricaGrezzo": scarica(`dati-prima-aggiornamento-${oggi()}.json`,new Blob([stato.grezzo||""],{type:"application/json"})); break;
    case "ricarica": location.reload(); break;
  }
}
async function salvaAnagrafica(){
  const c=clienteDa(vista.id), b=vista.bozza;
  if(!(b.ragione||b.cognome||b.nome).trim()){ toast("Inserisci almeno la ragione sociale o il cognome","err"); if(vista.tab!=="anagrafica") vai(`cliente/${c.id}/anagrafica`); return false; }
  if(b.email&&!/^\S+@\S+\.\S+$/.test(b.email)){ toast("L'indirizzo e-mail non sembra valido","err"); return false; }
  const modifiche=CAMPI_PERCORSI.filter(p=>String(leggi(c,p)??"")!==String(leggi(b,p)??"")).map(p=>({campo:ETICHETTE[p],prima:String(leggi(c,p)??""),dopo:String(leggi(b,p)??"")}));
  if(!modifiche.length){ vista.sporco=false; render(); toast("Nessuna modifica da salvare"); return true; }
  for(const p of CAMPI_PERCORSI) scrivi(c,p,leggi(b,p));
  registra("cliente","Dati cliente modificati",`${nomeCliente(c)}: ${modifiche.length} ${modifiche.length===1?"campo":"campi"}`,{clienteId:c.id,dettagli:modifiche});
  const ok=await salva();
  if(ok){ vista.sporco=false; vista.bozza=JSON.parse(JSON.stringify(c)); render(); toast("Dati del cliente salvati"); }
  return ok;
}
function prossimoCodice(){ const m=db.clienti.map(c=>/^C(\d+)$/.exec(c.codice||"")).filter(Boolean).map(x=>+x[1]); return "C"+String((m.length?Math.max(...m):0)+1).padStart(3,"0"); }
function formNuovoCliente(){
  apriModale(`${testaModale("Nuovo cliente")}
  <form id="fNC" novalidate><div class="campi">
    <label class="c4">Tipo cliente<select name="descrizione">${TIPI_CLIENTE.map(t=>`<option>${t}</option>`).join("")}</select></label>
    <label class="c8">Ragione sociale <span class="muto" style="font-weight:400">(azienda, condominio, ente)</span><input type="text" name="ragione" autofocus></label>
    <label class="c6">Cognome<input type="text" name="cognome"></label><label class="c6">Nome<input type="text" name="nome"></label>
    <label class="c6">Referente<input type="text" name="referente"></label><label class="c6">Telefono<input type="tel" name="mobile1"></label>
    <label class="c12">E-mail<input type="email" name="email"></label>
    <label class="c6">Indirizzo<input type="text" name="indirizzo"></label><label class="c4">Località<input type="text" name="localita"></label><label class="c2">Prov.<input type="text" name="prov" maxlength="2"></label>
  </div><p class="muto piccolo-t" style="margin-top:10px">Basta la ragione sociale oppure il cognome. Gli altri dati puoi completarli dopo nella scheda. Codice assegnato: <b>${prossimoCodice()}</b></p>
  <p class="errore-campo" id="errNC" role="alert"></p>
  <div class="modale-piede"><button type="button" class="btn" data-az="chiudiModale">Annulla</button><button class="btn primario" type="submit">${ic("check")}Crea cliente</button></div></form>`);
  $("#fNC").onsubmit=async e=>{
    e.preventDefault(); const f=Object.fromEntries(new FormData(e.target)); for(const k in f) f[k]=String(f[k]).trim();
    if(!f.ragione&&!f.cognome){ $("#errNC").textContent="Inserisci la ragione sociale oppure il cognome."; return; }
    if(f.email&&!/^\S+@\S+\.\S+$/.test(f.email)){ $("#errNC").textContent="L'indirizzo e-mail non sembra valido."; return; }
    const c=clienteVuoto(); Object.assign(c,{codice:prossimoCodice(),descrizione:f.descrizione,ragione:f.ragione,cognome:f.cognome,nome:f.nome,referente:f.referente,mobile1:f.mobile1,email:f.email});
    Object.assign(c.sede,{indirizzo:f.indirizzo,localita:f.localita,prov:f.prov.toUpperCase()});
    const simile=db.clienti.find(x=>norm(nomeCliente(x))===norm(nomeCliente(c)));
    if(simile&&!e.submitter?.dataset.forza){ $("#errNC").innerHTML=`Esiste già un cliente «${esc(nomeCliente(simile))}» (${esc(simile.codice)}). <button type="button" class="link-btn" data-az="apriCliente" data-id="${simile.id}">Apri quello</button> oppure <button class="link-btn" type="submit" data-forza="1">crea comunque</button>.`; return; }
    db.clienti.push(c); registra("cliente","Nuovo cliente",`${nomeCliente(c)} (${c.codice})`,{clienteId:c.id});
    chiudiModale(); await salva(); toast("Cliente creato"); vai(`cliente/${c.id}/panoramica`);
  };
}

/* ========================================================= AVVIO E PROCEDURA DI AGGIORNAMENTO */
function schermoBenvenuto(){
  $("#shell").hidden=true; $("#schermo").hidden=false;
  $("#schermo").innerHTML=`<div class="schermo"><div class="pannello">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:22px"><span style="width:40px;height:40px;border-radius:10px;background:var(--blu);display:grid;place-items:center"><svg width="26" height="26" viewBox="0 0 24 24"><use href="#i-house"/></svg></span><b style="font-size:16px">Gestionale Impianti</b></div>
    <h1 style="font-size:26px">Benvenuto</h1>
    <p class="sottotitolo">I tuoi clienti. I tuoi dati. Il tuo controllo.</p>
    <p class="sottotitolo">Su questo computer, in questo browser, non c'è ancora un archivio. Se ne avevi già uno, recuperalo qui sotto: <b>nulla viene sovrascritto senza la tua conferma</b>.</p>
    <div class="scelte">
      <button class="scelta" data-az="importaFile">${ic("upload")}<div><b>Recupera i miei dati da un file</b><span>Un'esportazione .zip, una copia .json o un backup della versione precedente</span></div></button>
      <button class="scelta" data-az="apriDaCartella" ${stato.cartella.supportata?"":"disabled"}>${ic("folder")}<div><b>Recupera i miei dati da una cartella</b><span>${stato.cartella.supportata?"La cartella che avevi collegato al gestionale":"Disponibile con Chrome o Edge sul computer"}</span></div></button>
      <button class="scelta" data-az="nuovoArchivio">${ic("plus")}<div><b>Inizia un archivio nuovo</b><span>Parti da zero e inserisci i tuoi clienti</span></div></button>
      <button class="scelta" data-az="demo">${ic("eye")}<div><b>Prova con dati di esempio</b><span>4 clienti di prova, da svuotare quando vuoi</span></div></button>
    </div>
    ${!stato.idb?`<div class="avviso arancio" style="margin-top:16px">${ic("alert")}<div class="corpo">Questo browser non permette l'archivio completo. Usa Chrome, Edge o Firefox.</div></div>`:""}
  </div></div>`;
}
async function procAggiornamento(grezzo,dati,origine){
  stato.grezzo=grezzo;
  const da=dati.appVersion||"1.x", schemaDa=dati.schema||1;
  const passi=[["copia","Copia di sicurezza dei dati attuali"],["verifica","Verifica che la copia sia ripristinabile"],["converti","Aggiornamento della struttura dei dati"],["continuita","Controllo che non manchi nulla"],["salva","Salvataggio e rilettura"]];
  $("#schermo").hidden=false;
  $("#schermo").innerHTML=`<div class="schermo"><div class="pannello">
    <h1>Aggiornamento del programma: da ${esc(da)} a ${APP_VERSION}</h1>
    <p class="sottotitolo">Prima di toccare qualsiasi cosa metto al sicuro i tuoi dati e controllo che si possano recuperare.</p>
    <ul class="passi" style="margin-top:18px">${passi.map(([k,t])=>`<li id="pa-${k}">${ic("circle")}<div><b>${t}</b><small></small></div></li>`).join("")}</ul><div id="esitoA"></div></div></div>`;
  const segna=(k,st,msg="")=>{ const li=$("#pa-"+k); li.className=st; li.querySelector("use").setAttribute("href","#i-"+({ok:"check-c",errore:"x-c",corso:"loader"}[st]||"circle")); li.querySelector("small").textContent=msg; };
  let corrente="copia";
  try{
    if(!stato.idb) throw new Error("Il browser non permette di creare la copia di sicurezza");
    segna("copia","corso");
    const bk=await creaBackup("pre-aggiornamento",`Prima dell'aggiornamento ${da} → ${APP_VERSION}`,{json:grezzo});
    segna("copia","ok",`Copia del ${dataOra(bk.ts)} · ${formatoByte(bk.dimensione)}`);
    corrente="verifica"; segna("verifica","corso");
    if(!bk.verifica.ok) throw new Error("La copia di sicurezza non ha superato la verifica: "+bk.verifica.dettagli.filter(x=>!x.esito).map(x=>x.msg).join("; "));
    segna("verifica","ok","Impronta, leggibilità e ripristino simulato superati");
    corrente="converti"; segna("converti","corso");
    const nuovo=migra(dati); const v=validaArchivio(nuovo); if(!v.ok) throw new Error(v.errori.join("; "));
    segna("converti","ok",schemaDa<SCHEMA?`Struttura dati convertita dalla versione ${schemaDa} alla ${SCHEMA}`:`Struttura dati già alla versione ${SCHEMA}: nessuna conversione necessaria`);
    corrente="continuita"; segna("continuita","corso");
    const a=contaTutto(dati), b=contaTutto(nuovo);
    if(a.clienti!==b.clienti||a.lavori!==b.lavori||a.documenti!==b.documenti) throw new Error(`Prima: ${a.clienti} clienti, ${a.lavori} lavori. Dopo: ${b.clienti} clienti, ${b.lavori} lavori`);
    segna("continuita","ok",`${b.clienti} clienti, ${b.lavori} lavori, ${b.documenti} documenti: identici a prima`);
    corrente="salva"; segna("salva","corso");
    nuovo.registro.push({id:uid(),ts:adesso(),operatore:"Sistema",entita:"dati",azione:"Aggiornamento programma",descrizione:`Da ${da} a ${APP_VERSION}. Copia di sicurezza verificata del ${dataOra(bk.ts)}. Continuità: ${b.clienti} clienti, ${b.lavori} lavori, ${b.documenti} documenti`});
    db=nuovo;
    if(!await salva()) throw new Error("Il salvataggio non è riuscito");
    segna("salva","ok","Archivio scritto e riletto: corrisponde");
    $("#esitoA").innerHTML=`<div class="avviso verde" style="margin-top:16px">${ic("check-c")}<div class="corpo"><b>Aggiornamento completato e verificato.</b>Tutti i tuoi dati ci sono. ${origine==="v1"?"La copia della versione precedente resta anche dove era.":""}</div></div><button class="btn primario grande" id="continuaA" style="width:100%">Continua</button>`;
    await new Promise(r=>{ $("#continuaA").onclick=r; $("#continuaA").focus(); });
    return true;
  }catch(e){
    segna(corrente,"errore",e.message);
    let intatti=false; try{ intatti = origine==="v1" ? lsGet(CHIAVE_V1)===grezzo : (await idbGet("kv","archivio"))===grezzo; }catch(x){}
    db=null;
    $("#esitoA").innerHTML=`<div class="avviso rosso" style="margin-top:16px">${ic("alert")}<div class="corpo"><b>L'aggiornamento è stato fermato per proteggere i tuoi dati.</b>
      <p style="margin:6px 0"><b>Cosa è successo:</b> ${esc(e.message)}.</p>
      <p style="margin:6px 0"><b>I tuoi dati:</b> ${intatti?"sono ancora quelli salvati prima dell'aggiornamento: li ho riletti e non sono stati modificati.":"non è stato possibile rileggerli per conferma: scarica subito la copia qui sotto."}</p>
      <p style="margin:6px 0 0"><b>Cosa puoi fare:</b> scarica una copia dei dati e riapri la versione precedente del programma, oppure riprova.</p></div></div>
      <div class="azioni-dati"><button class="btn primario" data-az="scaricaGrezzo">${ic("download")}Scarica una copia dei dati</button><button class="btn" data-az="ricarica">${ic("refresh")}Riprova</button></div>`;
    return false;
  }
}
function avviaApp(){
  if(!sessione.utente){ if(serveAccesso()){ vLogin(); return; } sessione.utente=db.utenti.find(u=>u.ruolo==="admin"&&u.attivo!==false); }
  $("#schermo").hidden=true; $("#shell").hidden=false;
  if(!stato._intervallo){ stato._intervallo=setInterval(()=>{ backupAutomaticoSeServe("Backup giornaliero").then(()=>eseguiControlli(false)).catch(()=>{}); },30*60*1000); }
  backupAutomaticoSeServe("Backup giornaliero all'apertura").catch(()=>{}).finally(()=>eseguiControlli(false));
  applicaHash();
}
async function avvio(){
  try{ await apriIDB(); }catch(e){ stato.idb=false; }
  let grezzo=null, origine=null;
  try{ grezzo = stato.idb ? await idbGet("kv","archivio") : lsGet(CHIAVE_LS); if(grezzo) origine="interno"; }catch(e){}
  if(!grezzo){ const v1=lsGet(CHIAVE_V1); if(v1){ grezzo=v1; origine="v1"; } }
  await caricaCartella();
  try{ if(navigator.storage?.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); }catch(e){}
  if(!grezzo){ schermoBenvenuto(); return; }
  let dati;
  try{ dati=JSON.parse(grezzo); }catch(e){
    stato.grezzo=grezzo;
    $("#schermo").innerHTML=`<div class="schermo"><div class="pannello"><h1>L'archivio salvato non è leggibile</h1><p class="sottotitolo">Il contenuto salvato nel browser è danneggiato. Non ho modificato nulla.</p><div class="azioni-dati"><button class="btn primario" data-az="scaricaGrezzo">Scarica il contenuto così com'è</button><button class="btn" data-az="importaFile">Recupera da un file</button></div></div></div>`;
    return;
  }
  if((dati.schema||1)>SCHEMA){ stato.sola=true; db=normalizza(dati); }
  else if((dati.schema||1)<SCHEMA || dati.appVersion!==APP_VERSION || origine==="v1"){ if(!await procAggiornamento(grezzo,dati,origine)) return; }
  else db=normalizza(dati);
  if(stato.salv.ok===null) stato.salv={ok:true,ts:null,errore:null};
  avviaApp();
}
avvio();
</script>
