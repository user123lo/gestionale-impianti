<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestionale Impianti</title>
<meta name="description" content="Gestionale clienti e lavorazioni. I tuoi clienti. I tuoi dati. Il tuo controllo.">
<style>
/* =========================================================
   DESIGN SYSTEM — token
   ========================================================= */
:root{
  /* primitivi (dal riferimento visivo) */
  --blu:#1766e5; --blu-700:#0d4fc0; --blu-50:#eaf2ff; --blu-100:#cfe0fc;
  --navy:#0b2f6e; --navy-2:#081f4c;
  --testo:#0f1b33; --testo-2:#334155; --grigio:#5b6779; --grigio-2:#8a96a8;
  --bordo:#e2e8f1; --bordo-forte:#cbd5e3;
  --sfondo:#eef3fa; --sup:#ffffff; --sup-2:#f6f9fd;
  --verde:#15803d; --verde-50:#dcfce7; --verde-100:#bbf0cd; --verde-vivo:#22c55e;
  --arancio:#b45309; --arancio-50:#fef3c7; --arancio-100:#fde3a7;
  --rosso:#b91c1c; --rosso-50:#fee2e2; --rosso-100:#fecaca;
  --r-s:8px; --r-m:14px; --r-l:18px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --ombra:0 1px 2px rgba(23,48,94,.04),0 6px 20px rgba(23,48,94,.07);
  --ombra-m:0 18px 48px rgba(16,40,90,.20);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sidebar:212px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.45;color:var(--testo);background:var(--sfondo)}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;line-height:1.25;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 var(--s3)}
h3{font-size:14px;margin:0 0 var(--s2)}
p{margin:0 0 var(--s3)}
a{color:var(--blu)}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:15px;height:15px}.ic.l{width:22px;height:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- Shell (sidebar, barra superiore) ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 14px 16px;color:#cfe0ff;background:linear-gradient(180deg,#10419a 0%,#0b2f6e 52%,#081f4c 100%);overflow:hidden;z-index:5}
.marchio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:0 6px 26px;position:relative;z-index:1}
.logo-scudo{width:60px;height:60px;filter:drop-shadow(0 8px 16px rgba(34,197,94,.45))}
.marchio .nome{color:#fff;font-weight:750;font-size:19px;line-height:1.15;letter-spacing:-.01em;margin-top:8px}
.marchio .motto{color:#b8cdf0;font-size:12.5px;line-height:1.45;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#d6e4fb;padding:12px 14px;border-radius:12px;cursor:pointer;font-weight:600;font-size:15px;text-align:left;transition:background .15s,color .15s,box-shadow .15s}
.nav button .ic{width:21px;height:21px}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current="page"]{background:linear-gradient(180deg,#2c7df7,#1766e5);color:#fff;box-shadow:0 8px 20px rgba(23,102,229,.45)}
.nav .pallino{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#94a3b8;flex:none}
.nav .pallino.ok{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.22),0 0 10px rgba(34,197,94,.7)}
.nav .pallino.attenzione{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.22)}
.nav .pallino.rischio{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.25)}
.onde{position:absolute;left:0;bottom:120px;width:100%;height:240px;pointer-events:none}
.sb-card{margin-top:auto;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:16px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:rgba(6,22,56,.6);color:#fff;cursor:pointer;font:inherit}
.sb-card:hover{background:rgba(6,22,56,.8)}
.sb-card .scudo{width:42px;height:42px}
.sb-card b{font-size:14px;line-height:1.3}
.sb-card small{color:#9fb6dc;font-size:12px}
.area{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 28px 0}
.cerca-globale{position:relative;flex:0 1 640px;display:flex;align-items:center}
.cerca-globale .ic{position:absolute;left:16px;color:#64748b;width:20px;height:20px}
.topbar .cerca-globale input{min-height:50px;border-radius:14px;padding:0 44px 0 48px;font-size:15.5px;border:1px solid var(--bordo);box-shadow:var(--ombra);background:#fff}
.cerca-globale kbd{position:absolute;right:14px}
.spingi{flex:1}
.campanella{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:#334155}
.campanella:hover,.utente-chip:hover{background:#fff;box-shadow:var(--ombra)}
.campanella .ic{width:23px;height:23px}
.campanella .conta{position:absolute;top:3px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--sfondo)}
.utente-chip{display:flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;padding:4px 10px 4px 4px;border-radius:999px;font-weight:600;font-size:15px;color:var(--testo)}
.utente-chip .av{width:42px;height:42px;border-radius:50%;background:#1e293b;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.contenuto{min-width:0;padding:18px 28px 48px;width:100%;max-width:1720px}
.popover{position:fixed;z-index:50;background:#fff;border:1px solid var(--bordo);border-radius:14px;box-shadow:var(--ombra-m);padding:8px;min-width:270px;max-width:min(440px,94vw);max-height:72vh;overflow:auto}
.pop-voce{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--testo);font:inherit;font-size:14px}
.pop-voce .ic{margin-top:1px;color:var(--grigio)}
.pop-voce.arancio .ic{color:#d97706}.pop-voce.rosso .ic{color:var(--rosso)}.pop-voce.verde .ic{color:var(--verde)}
.pop-voce:hover,.pop-voce:focus-visible{background:var(--blu-50)}
.pop-voce small{display:block;color:var(--grigio);font-size:12.5px;margin-top:1px}
.pop-titolo{font-size:12px;font-weight:700;color:var(--grigio);padding:8px 12px 4px}
.pop-sep{height:1px;background:var(--bordo);margin:6px 4px}
.pop-vuoto{padding:14px 12px;color:var(--grigio);font-size:14px}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:sticky;top:0;z-index:15;height:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;overflow-x:auto}
  .marchio{flex-direction:row;padding:0 6px 0 0}.marchio .nome,.marchio .motto{display:none}.logo-scudo{width:34px;height:34px}
  .nav{flex-direction:row;gap:4px}.nav button{padding:9px 11px;font-size:14px;white-space:nowrap}
  .onde{display:none}
  .sb-card{margin:0 0 0 auto;flex-direction:row;padding:6px 10px;white-space:nowrap}.sb-card small{display:none}.sb-card .scudo{width:24px;height:24px}
  .topbar{padding:12px 16px 0;gap:8px}
  .contenuto{padding:14px 16px 40px}
  .utente-chip .nome-u{display:none}
}
@media (max-width:620px){ .nav button .etic,.sb-card b,.cerca-globale kbd{display:none} .topbar .cerca-globale input{min-height:44px;font-size:15px} }

/* ---------- Componenti base ---------- */
.testata{display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s4)}
.testata .azioni{margin-left:auto;display:flex;gap:var(--s2);flex-wrap:wrap}
.sottotitolo{color:var(--grigio);margin:4px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--bordo-forte);background:var(--sup);color:var(--testo);padding:8px 14px;border-radius:var(--r-s);cursor:pointer;font-weight:600;min-height:40px;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s}
.btn:hover{background:var(--sup-2);border-color:var(--grigio-2)}
.btn.primario{background:var(--blu);border-color:var(--blu);color:#fff}
.btn.primario:hover{background:var(--blu-700);border-color:var(--blu-700)}
.btn.pericolo{color:var(--rosso);border-color:var(--rosso-100)}
.btn.pericolo:hover{background:var(--rosso-50)}
.btn.pericolo.pieno{background:var(--rosso);border-color:var(--rosso);color:#fff}
.btn.piccolo{min-height:30px;padding:5px 10px;font-size:13px}
.btn.grande{min-height:46px;padding:11px 20px;font-size:15px}
.btn.icona{padding:6px;min-height:32px;width:32px;border-color:transparent;background:transparent;color:var(--grigio)}
.btn.icona:hover{background:var(--blu-50);color:var(--blu)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link-btn{background:none;border:0;color:var(--blu);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.card{background:var(--sup);border:1px solid var(--bordo);border-radius:var(--r-m);padding:var(--s5);box-shadow:var(--ombra)}
.card+.card{margin-top:var(--s4)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:#eef1f5;color:var(--grigio)}
.badge.verde{background:var(--verde-50);color:var(--verde)}
.badge.arancio{background:var(--arancio-50);color:var(--arancio)}
.badge.rosso{background:var(--rosso-50);color:var(--rosso)}
.badge.blu{background:var(--blu-50);color:var(--blu-700)}
.muto{color:var(--grigio)}.piccolo-t{font-size:12.5px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--bordo-forte);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--grigio);background:var(--sup)}

/* form */
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=search],input[type=password],select,textarea{
  width:100%;border:1px solid var(--bordo-forte);border-radius:var(--r-s);padding:8px 10px;background:var(--sup);min-height:36px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blu-100);border-color:var(--blu)}
input[disabled],select[disabled],textarea[disabled]{background:var(--sup-2);color:var(--testo-2)}
textarea{min-height:76px;resize:vertical}
.campi{display:grid;grid-template-columns:repeat(12,1fr);gap:12px 14px}
.campi label,.campo{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--testo-2);font-weight:600}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:760px){.c2,.c3,.c4,.c5,.c6,.c8{grid-column:span 12}}
fieldset{border:0;border-top:1px solid var(--bordo);padding:var(--s4) 0 var(--s2);margin:0}
fieldset:first-child{border-top:0;padding-top:0}
legend{font-weight:700;font-size:13px;color:var(--testo);padding:0 8px 0 0}
.obbl{color:var(--rosso)}
.spunta{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:8px!important;font-weight:500!important;color:var(--testo)!important;cursor:pointer}
.spunta input{width:16px;height:16px;margin:0}
.errore-campo{color:var(--rosso);font-size:12.5px;font-weight:500}

/* tabelle */
.tabella-wrap{position:relative;background:var(--sup);border:1px solid var(--bordo);border-radius:var(--r-m);overflow-x:auto;box-shadow:var(--ombra)}
table.tabella{width:100%;border-collapse:collapse}
.tabella th{text-align:left;font-size:12px;font-weight:650;color:var(--grigio);padding:10px 12px;border-bottom:1px solid var(--bordo);background:var(--sup-2);white-space:nowrap}
.tabella th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tabella th button:hover{color:var(--testo)}
.tabella th button:focus-visible{outline:2px solid var(--blu)}
.tabella td{padding:11px 12px;border-bottom:1px solid var(--bordo);vertical-align:middle}
.tabella tr:last-child td{border-bottom:0}
.tabella tbody tr.clic{cursor:pointer}
.tabella tbody tr.clic:hover{background:#f5f9fd}
.tabella tbody tr.archiviato td{color:var(--grigio)}
.tabella .num{text-align:right;font-variant-numeric:tabular-nums}
.tabella .sec{display:block;color:var(--grigio);font-size:12.5px}
.tabella .azioni-col{width:1%;white-space:nowrap;text-align:right}
.tabella td.azioni-col{padding:4px 8px}
@media(max-width:1180px){.md{display:none}}
.vuoto{text-align:center;color:var(--grigio);padding:var(--s6) var(--s4)}
.vuoto .ic{width:30px;height:30px;color:var(--grigio-2);margin-bottom:6px}
.vuoto b{display:block;color:var(--testo);font-size:15px;margin-bottom:4px}

/* barra filtri */
.barra-filtri{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-bottom:var(--s3)}
.barra-filtri select{width:auto;min-width:150px}
.cerca-grande{position:relative;flex:1 1 340px;max-width:520px;display:flex;align-items:center}
.cerca-grande .ic{position:absolute;left:12px;color:var(--grigio)}
.cerca-grande input{padding-left:38px;padding-right:34px;min-height:42px;font-size:15px}
.cerca-grande kbd{position:absolute;right:10px}
.nota-riga{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--arancio);background:var(--arancio-50);border:1px solid var(--arancio-100);padding:8px 12px;border-radius:var(--r-s);margin-bottom:var(--s3);font-weight:500}
.conteggio{color:var(--grigio);font-size:12.5px;margin:8px 2px 0}

/* avvisi */
.avviso{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);border:1px solid;margin-bottom:var(--s4)}
.avviso .ic{margin-top:1px}
.avviso .corpo{flex:1}
.avviso .corpo b{display:block}
.avviso.rosso{background:var(--rosso-50);border-color:var(--rosso-100);color:#7c1e1e}
.avviso.arancio{background:var(--arancio-50);border-color:var(--arancio-100);color:#6f3f06}
.avviso.blu{background:var(--blu-50);border-color:var(--blu-100);color:#0d3d6b}
.avviso.verde{background:var(--verde-50);border-color:var(--verde-100);color:#145a32}

/* schede (tab) */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bordo);margin:var(--s5) 0 var(--s4);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--grigio);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--testo)}
.tabs button[aria-selected="true"]{color:var(--blu);border-bottom-color:var(--blu)}
.tabs .cnt{background:#eef1f5;color:var(--grigio);border-radius:999px;padding:0 7px;font-size:11.5px}

/* modale */
.modale-fondo{position:fixed;inset:0;background:rgba(14,26,40,.5);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:6vh 16px 16px;overflow:auto}
.modale-fondo.aperto{display:flex}
.modale{background:var(--sup);border-radius:var(--r-l);max-width:620px;width:100%;box-shadow:var(--ombra-m);padding:var(--s5)}
.modale.larga{max-width:860px}
.modale-testa{display:flex;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s4)}
.modale-testa h2{margin:0;font-size:18px}
.modale-testa .chiudi{margin-left:auto}
.modale-piede{display:flex;gap:var(--s2);justify-content:flex-end;flex-wrap:wrap;margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--bordo)}
.modale-piede .sx{margin-right:auto}

/* toast */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#17212b;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--ombra-m);display:flex;gap:8px;align-items:center;max-width:90vw;animation:entra .18s ease-out}
.toast.ok .ic{color:#6fdc9c}.toast.err{background:#7c1e1e}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Scheda cliente ---------- */
.indietro{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--blu);cursor:pointer;padding:4px 0;font-weight:600;margin-bottom:var(--s3)}
.intesta{display:flex;gap:var(--s4);align-items:flex-start;flex-wrap:wrap}
.avatar{width:54px;height:54px;border-radius:12px;background:var(--blu-50);color:var(--blu-700);display:grid;place-items:center;font-weight:700;font-size:19px;flex:none}
.intesta .titolo{flex:1;min-width:240px}
.intesta .titolo .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.intesta .azioni{display:flex;gap:var(--s2);flex-wrap:wrap}
.fatti{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s4);margin:var(--s5) 0 0;padding-top:var(--s4);border-top:1px solid var(--bordo)}
.fatti dt{font-size:12px;color:var(--grigio);font-weight:600;margin-bottom:2px}
.fatti dd{margin:0;overflow-wrap:anywhere}
.fatti dd.forte{font-weight:650}
.barra-salva{position:sticky;bottom:12px;z-index:10;margin-top:var(--s4);background:#17212b;color:#fff;border-radius:var(--r-m);padding:10px 12px 10px 16px;display:flex;align-items:center;gap:var(--s3);box-shadow:var(--ombra-m);flex-wrap:wrap}
.barra-salva .btn{min-height:32px}
.barra-salva .btn:not(.primario){background:transparent;color:#fff;border-color:#4d5a68}

/* storico lavorazioni */
.anno{margin-bottom:var(--s5)}
.anno h3{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--grigio);text-transform:uppercase;letter-spacing:.05em;margin:0 0 var(--s2)}
.lav{display:grid;grid-template-columns:96px 1fr auto;gap:var(--s4);background:var(--sup);border:1px solid var(--bordo);border-radius:var(--r-m);padding:14px 16px;margin-bottom:8px;cursor:pointer;position:relative}
.lav:hover{border-color:var(--blu-100);background:#fbfdff}
.lav.evidenza{outline:2px solid var(--blu);outline-offset:1px}
.lav.eliminata{opacity:.65;background:var(--sup-2)}
.lav .data{font-weight:700;color:var(--blu-700);line-height:1.2}
.lav .data small{display:block;font-weight:500;color:var(--grigio);font-size:12px;margin-top:2px}
.lav .tipo{font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lav .desc{color:var(--testo-2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.lav .meta{color:var(--grigio);font-size:12.5px;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lav .meta span{display:inline-flex;gap:4px;align-items:center}
.lav .soldi{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lav .soldi b{display:block;margin-bottom:4px}
@media(max-width:700px){.lav{grid-template-columns:1fr}.lav .soldi{text-align:left}}
.totali{display:flex;gap:var(--s4);flex-wrap:wrap;color:var(--grigio);font-size:13px}
.totali b{color:var(--testo);font-variant-numeric:tabular-nums}
.dettaglio dl{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;margin:0}
.dettaglio dt{color:var(--grigio);font-weight:600;font-size:13px}
.dettaglio dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

.storico .desc-c{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#334155}
.storico .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.storico tr.evidenza td{background:#e8f0ff}
.storico tr.eliminata td{color:#94a3b8}
.storico .chev{color:#94a3b8;width:16px;height:16px}
@media(max-width:820px){.storico .op-c,.storico .desc-c{display:none}}
.link-freccia{display:inline-flex;align-items:center;gap:6px;margin-top:12px;text-decoration:none;font-size:14px}
.link-freccia .ic{width:16px;height:16px;transition:transform .15s}.link-freccia:hover .ic{transform:translateX(3px)}
.tessere{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tessera{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 10px 12px;border-radius:16px;background:#fff;border:1px solid var(--bordo);box-shadow:var(--ombra);cursor:pointer;font:inherit;color:var(--testo);transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s}
.tessera:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(23,48,94,.13)}
.tessera:active{transform:translateY(0) scale(.98)}
.tessera .ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.tessera .ico .ic{width:26px;height:26px}
.t-verde{background:#dcfce7;color:#16a34a}.t-blu{background:#dbeafe;color:#1d4ed8}.t-viola{background:#ede9fe;color:#6d28d9}.t-scuro{background:#e2e8f0;color:#1e293b}
.tessera b{font-size:15px}
.tessera small{display:flex;gap:6px;align-items:center;justify-content:center;width:100%;background:#f1f5fa;border-radius:8px;padding:5px 8px;color:#475569;font-size:12.5px}
.tessera small .ic.ok{color:#16a34a}.tessera small .ic.att{color:#d97706}
@media(max-width:980px){.tessere{grid-template-columns:repeat(2,1fr)}}

/* centro controllo laterale */
.rail{background:#fff;border:1px solid var(--bordo);border-radius:18px;box-shadow:var(--ombra);overflow:hidden;position:sticky;top:16px}
.rail-testa{display:flex;align-items:center;gap:12px;padding:18px;color:#fff;background:linear-gradient(135deg,#1650b8 0%,#0b2f6e 100%)}
.rail-testa .scudo{width:44px;height:44px;flex:none}
.rail-testa b{display:block;font-size:20px;letter-spacing:-.01em}
.rail-testa small{color:#c3d6f7;font-size:13.5px}
.rail-stato{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;padding:20px 18px;background:linear-gradient(180deg,#e5f7ec,#fff);border:0;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.rail-stato.attenzione{background:linear-gradient(180deg,#fff3dc,#fff)}.rail-stato.rischio{background:linear-gradient(180deg,#fde8e8,#fff)}.rail-stato.attesa{background:linear-gradient(180deg,#f1f5f9,#fff)}
.cerchio{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 35% 30%,#4ade80,#16a34a);box-shadow:0 0 0 7px rgba(34,197,94,.16),0 10px 22px rgba(22,163,74,.35)}
.attenzione .cerchio{background:radial-gradient(circle at 35% 30%,#fbbf24,#d97706);box-shadow:0 0 0 7px rgba(245,158,11,.16),0 10px 22px rgba(217,119,6,.3)}
.rischio .cerchio{background:radial-gradient(circle at 35% 30%,#f87171,#dc2626);box-shadow:0 0 0 7px rgba(239,68,68,.16),0 10px 22px rgba(220,38,38,.3)}
.attesa .cerchio{background:radial-gradient(circle at 35% 30%,#cbd5e1,#94a3b8);box-shadow:0 0 0 7px rgba(148,163,184,.16)}
.cerchio .ic{width:36px;height:36px;stroke-width:3.2}
.cerchio.pulsa{animation:pulsa 1s cubic-bezier(.2,.8,.2,1)}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6),0 10px 22px rgba(22,163,74,.35)}100%{box-shadow:0 0 0 22px rgba(34,197,94,0),0 10px 22px rgba(22,163,74,.35)}}
.rail-stato b{display:block;font-size:19px;line-height:1.22;letter-spacing:-.015em;color:#0b1b3a}
.rail-stato small{display:block;color:#475569;font-size:13px;margin-top:5px;line-height:1.4}
.rail-stato small.salvato{color:var(--verde);font-weight:600;margin-top:6px}
.rail-num{list-style:none;margin:0;padding:2px 14px}
.rail-num li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--bordo)}
.rail-num li:first-child{border-top:0}
.rail-num .t{width:44px;height:44px;border-radius:12px;background:var(--blu-50);color:var(--blu);display:grid;place-items:center}
.rail-num span{color:#334155;font-size:14px}
.rail-num b{display:block;font-size:20px;color:#0b1b3a;font-variant-numeric:tabular-nums;line-height:1.2}
.rail-azioni{display:grid;gap:10px;padding:8px 14px 14px}
.rail-azioni .btn{width:100%;min-height:48px;border-radius:12px;font-size:15px}
.btn.contorno{border:1.5px solid var(--blu);color:var(--blu-700);background:#fff}
.btn.contorno:hover{background:var(--blu-50)}
.rail-info{margin:0 14px 14px;padding:12px 14px;border-radius:12px;background:#eef4ff;color:#1e3a8a;font-size:12.5px;line-height:1.45;display:grid;grid-template-columns:18px 1fr 30px;gap:10px;align-items:center}
.rail-info .scudo{width:30px;height:30px}
.tabella th{background:#f1f5fa;color:#334155}
.guida li{margin:0 0 10px}

/* ---------- Documenti: tipi, cartelle, azienda ---------- */
.dchip{display:inline-block;font-size:11px;font-weight:750;letter-spacing:.02em;padding:2px 6px;border-radius:6px;background:#e0ecff;color:#1d4ed8;margin-right:4px;vertical-align:middle}
.dchip.manca{background:#fff7ed;color:#c2410c;box-shadow:inset 0 0 0 1px #fdba74}
.slot-doc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.slot{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;border:1px solid var(--bordo);border-radius:12px;padding:10px 12px;background:#f8fafd;font-weight:400}
.slot>.ic{color:var(--blu);width:22px;height:22px}.slot.ok>.ic{color:var(--verde)}
.slot b{display:block;font-size:14px}.slot small{color:#64748b;font-size:12.5px}
.slot input{grid-column:1/-1;font-size:13px}
@media(max-width:620px){.slot-doc{grid-template-columns:1fr}}
.altri-all{display:grid;gap:6px;font-weight:600;font-size:14px}
.zona-azioni{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 8px}
.chips-filtro{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip-f{border:1px solid var(--bordo);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:#334155;min-height:32px}
.chip-f:hover{border-color:#bcd0ee}
.chip-f[aria-pressed="true"]{background:var(--blu);border-color:var(--blu);color:#fff}
.tabella select.sel-cat{width:auto;min-width:170px;max-width:220px;min-height:34px;padding:4px 8px;font-size:13px}
@media(max-width:620px){.tabella .c-car,.tabella .c-dim{display:none}.tabella select.sel-cat{min-width:140px}}
.doc-lav{display:grid;gap:8px}.doc-lav-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.doc-lav-r>.ic{color:#94a3b8}.doc-lav-r.ok>.ic{color:var(--verde)}
.cat-anteprima{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.saltati{margin:8px 0 0;padding-left:18px;font-size:13px;color:#475569;max-height:180px;overflow:auto}
.barra-av{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin:12px 0}
.barra-av span{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);transition:width .2s}
.esito-cart{display:flex;gap:14px;align-items:center;margin:4px 0 12px}
.cerchio-ok{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#4ade80,#16a34a);color:#fff;flex:none;box-shadow:0 8px 20px rgba(22,163,74,.35)}
.cerchio-ok.att{background:linear-gradient(180deg,#fbbf24,#d97706);box-shadow:0 8px 20px rgba(217,119,6,.3)}
.cerchio-ok .ic{width:28px;height:28px}
.scad-riepilogo{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 16px}
.scad-t{background:#fff;border:1px solid var(--bordo);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--ombra)}
.scad-t .n{font-size:26px;font-weight:780;line-height:1;color:#0f172a}.scad-t small{display:block;color:#475569;font-size:13px;margin-top:3px}
.scad-t .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.scad-t.rosso .ico,.ico-az.rosso{background:#fee2e2;color:#b91c1c}.scad-t.arancio .ico,.ico-az.arancio{background:#ffedd5;color:#c2410c}
.scad-t.verde .ico,.ico-az.verde{background:#dcfce7;color:#15803d}.scad-t.grigio .ico,.ico-az.grigio{background:#f1f5f9;color:#64748b}
@media(max-width:900px){.scad-riepilogo{grid-template-columns:repeat(2,1fr)}}
.az-doc{display:flex;gap:10px;align-items:center;min-width:0}
.az-doc .sec{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico-az{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.nav .conta-nav{margin-left:auto;min-width:20px;height:20px;border-radius:99px;background:#f59e0b;color:#1f1300;font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.nav .conta-nav.rosso{background:#ef4444;color:#fff}
.rail-avviso{display:flex;gap:10px;align-items:center;width:100%;margin:-4px 0 14px;padding:10px 12px;border-radius:12px;border:1px solid #fed7aa;background:#fff7ed;color:#9a3412;font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.rail-avviso.rosso{border-color:#fecaca;background:#fef2f2;color:#991b1b}
.rail-avviso b{display:block}
.td-doc .sec .ic{width:13px;height:13px;vertical-align:-2px}

/* ---------- Scheda unica anagrafica | impianto ---------- */
.det-corpo{container-type:inline-size}
.col-tit{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:17px;letter-spacing:-.01em;color:#0b1b3a}
.col-tit .ic{color:var(--blu)}
.col-imp{margin-top:20px;background:linear-gradient(180deg,#f5f9ff,#fbfdff);border:1px solid #d6e4f7;border-radius:16px;padding:16px 16px 6px;scroll-margin-top:16px}
@container (min-width:860px){.due-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}.col-imp{margin-top:0}}
.imp-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin:0 0 18px;padding:14px 16px;border:1px solid #d6e4f7;border-radius:16px;background:linear-gradient(180deg,#f5f9ff,#fbfdff);width:100%;text-align:left;font:inherit;color:inherit}
.imp-vuoto{cursor:pointer;grid-template-columns:auto 1fr auto;border-style:dashed}
.imp-vuoto>.ic{color:var(--blu);width:24px;height:24px}.imp-vuoto b{display:block}.imp-vuoto small{color:#64748b}
.imp-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 6px 16px rgba(29,78,216,.28)}
.imp-ico .ic{width:24px;height:24px}
.imp-dati{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 16px;margin:0}
.imp-dati dt{font-size:12px;font-weight:650;color:#64748b;text-transform:none;margin:0}
.imp-dati dd{margin:2px 0 0;font-weight:650;color:#0f172a;font-size:14px;min-width:0;overflow-wrap:anywhere}
.imp-dati dd small{display:block;font-weight:500;color:#475569;font-size:12.5px}
@container (max-width:700px){.imp-dati{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:460px){.imp-card{grid-template-columns:1fr}.imp-ico{display:none}.imp-card>.btn{justify-self:start}}

/* stampa */
#stampa{display:none}
@media print{
  body.in-stampa > *:not(#stampa){display:none!important}
  body.in-stampa #stampa{display:block}
  body{background:#fff;font-size:11pt}
  #stampa h1{font-size:18pt}#stampa h2{font-size:13pt;margin-top:14pt;border-bottom:1px solid #999;padding-bottom:3pt}
  #stampa table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #stampa th,#stampa td{border-bottom:1px solid #ccc;padding:4pt;text-align:left;vertical-align:top}
  #stampa .cliente{page-break-inside:avoid;margin-bottom:16pt}
  #stampa .salto{page-break-before:always}
}

<script>
"use strict";
/* =====================================================================
   GESTIONALE IMPIANTI — versione 2
   ---------------------------------------------------------------------
   Dove stanno i dati
   - Archivio di lavoro: IndexedDB del browser, database "gestionale_impianti",
     archivio "kv", chiave "archivio" (testo JSON, struttura versione SCHEMA).
   - Documenti allegati: archivio "allegati", un file per impronta SHA-256.
   - Copie di sicurezza: archivio "backup", con impronta e verifica.
   - Copia esterna facoltativa: una cartella scelta dall'utente (File System Access).
   Il codice (questo file) è separato dai dati: sostituire il file con una
   versione nuova non cancella nulla. All'apertura di una versione nuova parte
   la procedura di aggiornamento: copia → verifica → conversione → controllo → salvataggio.
   ===================================================================== */
const APP_VERSION = "2.2.0";
const SCHEMA = 2;
const IDB_NOME = "gestionale_impianti";
const CHIAVE_V1 = "gestionale_impianti_v1";
const CHIAVE_LS = "gestionale_impianti_v2_riserva";
const MAX_DOC = 25*1024*1024;
const BACKUP_OGNI_MODIFICHE = 25;
const CONSERVA = {automatico:14, manuale:30, sicurezza:20};

const RUOLI = {admin:"Amministratore", operatore:"Operatore", lettura:"Sola consultazione"};
const PERMESSI = {
  admin:["modifica","elimina","backup","esporta","ripristina","utenti"],
  operatore:["modifica","backup","esporta"],
  lettura:[]
};
const TIPI_CLIENTE = ["Privato","Condominio","Azienda","Ente pubblico"];
const TIPI_LAVORO = ["Manutenzione ordinaria","Manutenzione straordinaria","Riparazione","Installazione","Prima accensione","Analisi fumi","Sopralluogo","Sostituzione componente","Altro"];
const STATI_LAVORO = ["Completata","In corso","Programmata","Annullata"];
const TIPI_IMPIANTO = ["Caldaia","Pompa di calore","Condizionatore","Solare termico","Fotovoltaico","Scaldabagno","Impianto idraulico","Altro"];

/* ========================================================= UTILITÀ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const ic = (n,c="") => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const adesso = ()=>new Date().toISOString();
const isoLocale = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const oggi = ()=>isoLocale(new Date());
function aggiungiGiorni(d,n){ const x=new Date(d+"T12:00"); x.setDate(x.getDate()+n); return isoLocale(x); }
const dataIt = d => d ? new Date(d.length<=10?d+"T00:00":d).toLocaleDateString("it-IT") : "—";
const dataLunga = d => d ? new Date(d+"T00:00").toLocaleDateString("it-IT",{day:"numeric",month:"short"}) : "—";
const dataOra = ts => ts ? new Date(ts).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
const ora = ts => ts ? new Date(ts).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}) : "—";
function tempoFa(ts){
  if(!ts) return "mai";
  const s=(Date.now()-new Date(ts))/1000;
  if(s<60) return "pochi secondi fa";
  if(s<3600) return Math.floor(s/60)+" min fa";
  if(s<86400){ const h=Math.floor(s/3600); return h+(h===1?" ora fa":" ore fa"); }
  const g=Math.floor(s/86400); return g===1?"ieri":g+" giorni fa";
}
const giorniDa = ts => ts ? (Date.now()-new Date(ts))/86400000 : Infinity;
const formatoByte = n => n<1024 ? n+" B" : n<1048576 ? (n/1024).toFixed(1).replace(".",",")+" KB" : (n/1048576).toFixed(1).replace(".",",")+" MB";
const num = v => { const n=Number(String(v??"").replace(",",".")); return isFinite(n)?n:0; };
const euro = n => num(n).toLocaleString("it-IT",{style:"currency",currency:"EUR"});
const norm = s => String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
const nomeCliente = c => (c && (c.ragione || [c.cognome,c.nome].filter(Boolean).join(" "))) || "(senza nome)";
const iniziali = c => (nomeCliente(c).replace(/[()]/g,"").split(/\s+/).filter(Boolean).map(p=>p[0]).join("").slice(0,2)||"?").toUpperCase();
const lavoriAttivi = c => c.lavori.filter(l=>!l.eliminato);
const daPagare = l => l.stato==="Annullata" ? 0 : Math.max(0,num(l.costo)-num(l.pagato));
const daIncassareCliente = c => lavoriAttivi(c).reduce((s,l)=>s+daPagare(l),0);
function ultimoLavoro(c){ return lavoriAttivi(c).filter(l=>l.stato!=="Annullata"&&l.stato!=="Programmata"&&l.data).sort((a,b)=>b.data.localeCompare(a.data))[0]; }
const nomeFileSicuro = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w.\- ]+/g,"_").replace(/\s+/g," ").trim().slice(0,80) || "file";
const impronta16 = h => String(h||"").split(":").pop().slice(0,16);

function statoContratto(c){
  const f=c.impianto?.fine; if(!f) return {k:"nessuno",txt:"Nessun contratto",cls:""};
  const t=oggi();
  if(f<t) return {k:"scaduto",txt:"Scaduto",cls:"rosso"};
  if(f<=aggiungiGiorni(t,60)) return {k:"scadenza",txt:"In scadenza",cls:"arancio"};
  return {k:"attivo",txt:"Attivo",cls:"verde"};
}

/* ---- impronte digitali (SHA-256) e codifiche ---- */
const HA_CRYPTO = !!(window.crypto && crypto.subtle);
async function sha256(dati){
  const u = typeof dati==="string" ? new TextEncoder().encode(dati) : (dati instanceof Uint8Array ? dati : new Uint8Array(dati));
  if(HA_CRYPTO){
    const h=await crypto.subtle.digest("SHA-256",u);
    return "sha256:"+[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  let a=0x811c9dc5,b=0x9747b28c;
  for(let i=0;i<u.length;i++){ a^=u[i]; a=Math.imul(a,16777619); b^=u[i]; b=Math.imul(b,0x5bd1e995); b^=b>>>15; }
  return "fnv:"+(a>>>0).toString(16).padStart(8,"0")+(b>>>0).toString(16).padStart(8,"0");
}
function bufToB64(buf){ const u=new Uint8Array(buf); let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function b64ToBuf(b){ const s=atob(b); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }

/* ========================================================= ARCHIVIO INTERNO (IndexedDB) */
let _idb=null;
function apriIDB(){
  return new Promise((ok,ko)=>{
    if(!("indexedDB" in window)) return ko(new Error("IndexedDB non disponibile"));
    let r; try{ r=indexedDB.open(IDB_NOME,1); }catch(e){ return ko(e); }
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      if(!d.objectStoreNames.contains("allegati")) d.createObjectStore("allegati",{keyPath:"hash"});
      if(!d.objectStoreNames.contains("backup")) d.createObjectStore("backup",{keyPath:"id"}); };
    r.onsuccess=()=>{ _idb=r.result; ok(_idb); };
    r.onerror=()=>ko(r.error||new Error("Apertura non riuscita"));
    r.onblocked=()=>ko(new Error("L'archivio è bloccato da un'altra finestra del gestionale"));
  });
}
function tx(store,mode,fn){
  return new Promise((ok,ko)=>{
    let t; try{ t=_idb.transaction(store,mode); }catch(e){ return ko(e); }
    let res; const req=fn(t.objectStore(store));
    if(req) req.onsuccess=()=>{ res=req.result; };
    t.oncomplete=()=>ok(res); t.onerror=()=>ko(t.error); t.onabort=()=>ko(t.error||new Error("Operazione interrotta"));
  });
}
const idbGet=(st,k)=>tx(st,"readonly",s=>s.get(k));
const idbPut=(st,v,k)=>tx(st,"readwrite",s=>k===undefined?s.put(v):s.put(v,k));
const idbDel=(st,k)=>tx(st,"readwrite",s=>s.delete(k));
const idbAll=st=>tx(st,"readonly",s=>s.getAll());
const idbKeys=st=>tx(st,"readonly",s=>s.getAllKeys());
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }

/* ========================================================= STATO APPLICAZIONE */
let db = null;
const sessione = {utente:null};
const stato = {
  idb:true, sola:false,
  salv:{ok:null,ts:null,errore:null},
  controlli:null,
  modificheDaBackup:0,
  cartella:{supportata:"showDirectoryPicker" in window, handle:null, nome:"", permesso:null, ultima:null, errore:null},
  ultimaEsportazione:null, persistente:null
};
const allegatiInSospeso = new Set();
const nomeOp = ()=>sessione.utente?.nome || "Sistema";
const puo = p => (p==="esporta" ? true : !stato.sola) && (PERMESSI[sessione.utente?.ruolo||"lettura"]||[]).includes(p);

/* ========================================================= MODELLO DATI */
function impiantoVuoto(){ return {codCatasto:"",matricola:"",contratto:"",inizio:"",fine:"",condizioni:"",tipo:"Caldaia",modello:"",fabbricante:"",combustibile:"",tipoCamera:"",acqua:"",potNominale:"",potUtile:"",rendimento:"",potAssorbita:"",tempRisc:"",effEnergetica:"",termostato:"",valvole:"",evacuazione:"",progettista:"",installatore:"",dataInstallazione:"",note:""}; }
function clienteVuoto(){ return {id:uid(),codice:"",ragione:"",cognome:"",nome:"",descrizione:"Privato",referente:"",
  sede:{indirizzo:"",localita:"",prov:"",cap:"",piano:"",interno:"",scala:""},
  residenza:{indirizzo:"",localita:"",prov:"",cap:""},
  cf:"",piva:"",tel:"",mobile1:"",mobile2:"",email:"",pec:"",sdi:"",note:"",
  impianto:impiantoVuoto(), archiviato:false, archiviatoIl:null, creato:adesso(), lavori:[], documenti:[], noteDiario:[]}; }
function lavoroBase(){ return {id:uid(),data:oggi(),tipo:TIPI_LAVORO[0],stato:"Completata",descrizione:"",tecnico:"",ore:"",costo:"",pagato:"",note:"",allegati:[],eliminato:false,revisioni:[],creato:null,creatoDa:"",modificato:null,modificatoDa:""}; }
function utenteTitolare(){ return {id:uid(),nome:"Titolare",ruolo:"admin",attivo:true,pinHash:null,pinSalt:null}; }
function archivioVuoto(){ const t=adesso(); return {schema:SCHEMA,appVersion:APP_VERSION,creato:t,aggiornato:t,clienti:[],azienda:{documenti:[]},utenti:[utenteTitolare()],recupero:null,registro:[],eventi:{ultimaEsportazione:null,ultimoBackupEsterno:null}}; }
function voce(entita,azione,descrizione,extra={}){ return {id:uid(),ts:adesso(),operatore:nomeOp(),entita,azione,descrizione,...extra}; }
function registra(entita,azione,descrizione,extra={}){ db.registro.push(voce(entita,azione,descrizione,extra)); }

/* Migrazioni versionate: MIGRAZIONI[n] converte dalla struttura n alla n+1. Funzioni pure. */
const MIGRAZIONI = {
  1:(d)=>{
    const t=adesso();
    const out={schema:2,appVersion:APP_VERSION,creato:t,aggiornato:t,clienti:[],utenti:[utenteTitolare()],recupero:null,registro:[],
      eventi:{ultimaEsportazione:null,ultimoBackupEsterno:d.ultimoBackup?{ts:d.ultimoBackup,tipo:"file .json della versione 1"}:null}};
    for(const c of (d.clienti||[])){
      const v=clienteVuoto();
      const n=Object.assign(v,c);
      n.sede=Object.assign(clienteVuoto().sede,c.sede||{});
      n.residenza=Object.assign(clienteVuoto().residenza,c.residenza||{});
      n.impianto=Object.assign(impiantoVuoto(),c.impianto||{});
      n.referente=c.referente||""; n.archiviato=false; n.archiviatoIl=null; n.creato=c.creato||null;
      n.documenti=[]; n.noteDiario=[];
      n.lavori=(c.lavori||[]).map(l=>Object.assign(lavoroBase(),l,{stato:l.stato||"Completata",note:l.note||"",allegati:[],eliminato:false,revisioni:[],creato:null,creatoDa:"",modificato:null,modificatoDa:""}));
      out.clienti.push(n);
    }
    out.registro.push({id:uid(),ts:t,operatore:"Sistema",entita:"dati",azione:"Conversione archivio",descrizione:`Struttura dati convertita dalla versione 1 alla 2: ${out.clienti.length} clienti e ${out.clienti.reduce((s,c)=>s+c.lavori.length,0)} lavori`});
    return out;
  }
};
function migra(dati){
  let d=JSON.parse(JSON.stringify(dati));
  let v=d.schema||1;
  if(v>SCHEMA) throw new Error(`L'archivio è stato creato con una versione più recente del programma (struttura ${v}).`);
  while(v<SCHEMA){ const f=MIGRAZIONI[v]; if(!f) throw new Error(`Manca la conversione dalla struttura ${v}`); d=f(d); v=d.schema; }
  return normalizza(d);
}
function normalizza(d){
  d.clienti=Array.isArray(d.clienti)?d.clienti:[];
  for(const c of d.clienti){
    const v=clienteVuoto();
    for(const k in v) if(c[k]===undefined) c[k]=v[k];
    c.sede=Object.assign(v.sede,c.sede||{}); c.residenza=Object.assign(v.residenza,c.residenza||{}); c.impianto=Object.assign(impiantoVuoto(),c.impianto||{});
    c.lavori=(Array.isArray(c.lavori)?c.lavori:[]).map(l=>{ const b=lavoroBase(); for(const k in b) if(l[k]===undefined) l[k]=b[k]; return l; });
    if(!Array.isArray(c.documenti)) c.documenti=[];
    if(!Array.isArray(c.noteDiario)) c.noteDiario=[];
  }
  d.azienda=Object.assign({documenti:[]},d.azienda&&typeof d.azienda==="object"?d.azienda:{});
  if(!Array.isArray(d.azienda.documenti)) d.azienda.documenti=[];
  d.registro=Array.isArray(d.registro)?d.registro:[];
  d.utenti=Array.isArray(d.utenti)&&d.utenti.length?d.utenti:[utenteTitolare()];
  if(!d.utenti.some(u=>u.ruolo==="admin"&&u.attivo!==false)) d.utenti.push(utenteTitolare());
  d.eventi=Object.assign({ultimaEsportazione:null,ultimoBackupEsterno:null},d.eventi||{});
  if(d.recupero===undefined) d.recupero=null;

}
function validaArchivio(d){
  const e=[];
  if(!d||typeof d!=="object") return {ok:false,errori:["Il contenuto non è un archivio del gestionale"]};
  if(d.schema!==SCHEMA) e.push(`Struttura dati inattesa (versione ${d.schema})`);
  if(!Array.isArray(d.clienti)) e.push("Manca l'elenco dei clienti");
  else{
    const ids=new Set(), lids=new Set();
    d.clienti.forEach((c,i)=>{
      if(!c||typeof c.id!=="string"||!c.id){ e.push(`Il cliente n. ${i+1} non ha un identificativo`); return; }
      if(ids.has(c.id)) e.push(`Il cliente ${nomeCliente(c)} compare due volte`); ids.add(c.id);
      if(!Array.isArray(c.lavori)) e.push(`${nomeCliente(c)}: storico lavorazioni non leggibile`);
      else c.lavori.forEach(l=>{ if(!l||!l.id||lids.has(l.id)) e.push(`${nomeCliente(c)}: lavorazione senza identificativo univoco`); else lids.add(l.id);
        if(l&&l.data&&!/^\d{4}-\d{2}-\d{2}$/.test(l.data)) e.push(`${nomeCliente(c)}: data non valida (${l.data})`); });
      if(!Array.isArray(c.documenti)) e.push(`${nomeCliente(c)}: elenco documenti non leggibile`);
      else c.documenti.forEach(x=>{ if(!x||!x.hash) e.push(`${nomeCliente(c)}: documento senza impronta`); });
      if(!Array.isArray(c.noteDiario)) e.push(`${nomeCliente(c)}: note non leggibili`);
    });
  }
  if(d.azienda!==undefined){ if(!d.azienda||!Array.isArray(d.azienda.documenti)) e.push("Elenco dei documenti dell'azienda non leggibile"); else d.azienda.documenti.forEach(x=>{ if(!x||!x.hash) e.push("Un documento dell'azienda non ha l'impronta"); }); }
  if(!Array.isArray(d.registro)) e.push("Manca il registro delle modifiche");
  if(!Array.isArray(d.utenti)||!d.utenti.some(u=>u.ruolo==="admin"&&u.attivo!==false)) e.push("Nessun amministratore attivo");
  return {ok:!e.length, errori:e.slice(0,15)};
}
function contaTutto(d){
  let lavori=0,documenti=0,note=0;
  for(const c of (d.clienti||[])){ lavori+=(c.lavori||[]).length; documenti+=(c.documenti||[]).length; note+=(c.noteDiario||[]).length; }
  documenti+=((d.azienda&&d.azienda.documenti)||[]).length;
  return {clienti:(d.clienti||[]).length,lavori,documenti,note};
}
function contaVisibili(d){
  let lavori=0,documenti=0,note=0,dim=0;
  for(const c of d.clienti){ lavori+=lavoriAttivi(c).length; const docs=c.documenti.filter(x=>!x.eliminato); documenti+=docs.length; dim+=docs.reduce((s,x)=>s+(x.dimensione||0),0); note+=c.noteDiario.filter(n=>!n.eliminato).length; }
  const az=((d.azienda&&d.azienda.documenti)||[]).filter(x=>!x.eliminato); documenti+=az.length; dim+=az.reduce((s,x)=>s+(x.dimensione||0),0);
  return {clienti:d.clienti.length,attivi:d.clienti.filter(c=>!c.archiviato).length,lavori,documenti,note,dimDoc:dim};
}

async function creaBackup(tipo,motivo,{json=null}={}){
  if(!stato.idb) throw new Error("L'archivio interno del browser non è disponibile");
  const testo=json??JSON.stringify(db);
  let dati=null; try{ dati=JSON.parse(testo); }catch(e){}
  const hash=await sha256(testo);
  const allegati=dati&&Array.isArray(dati.clienti)?[...new Set(docsTutti(dati).map(x=>x.hash))]:[];
  let dimAll=0; for(const h of allegati){ const a=await idbGet("allegati",h); if(a) dimAll+=a.dimensione||0; }
  const rec={id:"bk-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:adesso(),tipo,motivo,json:testo,hash,
    dimensione:new Blob([testo]).size+dimAll,conteggi:dati?contaTutto(dati):null,schema:dati?.schema||1,appVersion:APP_VERSION,
    allegati,verifica:null,operatore:nomeOp()};
  await idbPut("backup",rec);
  rec.verifica=await verificaBackup(rec.id);
  if(tipo==="automatico"||tipo==="manuale") stato.modificheDaBackup=0;
  await potaBackup();
  return rec;
}
/* Una copia è valida solo se: l'impronta coincide, si legge, il ripristino simulato riesce,
   i conteggi coincidono e tutti i documenti allegati esistono con impronta corretta. */
async function verificaBackup(id){
  const det=[]; let ok=true;
  const passo=(lab,esito,msg)=>{ det.push({lab,esito,msg}); if(!esito) ok=false; };
  try{
    const rec=await idbGet("backup",id);
    if(!rec) throw new Error("Copia non trovata");
    const h=await sha256(rec.json);
    passo("Impronta digitale", h===rec.hash, h===rec.hash?"Identica a quella registrata alla creazione":"Il contenuto è cambiato dopo la creazione");
    let d=null; try{ d=JSON.parse(rec.json); passo("Leggibilità",true,"Il contenuto si legge correttamente"); }catch(e){ passo("Leggibilità",false,"Il contenuto non è leggibile"); }
    if(d){
      let m=null;
      try{ m=migra(d); const v=validaArchivio(m); passo("Prova di ripristino",v.ok,v.ok?"Ripristino simulato riuscito, senza toccare i dati attuali":v.errori.join("; ")); }
      catch(e){ passo("Prova di ripristino",false,e.message); }
      if(m&&rec.conteggi){ const c=contaTutto(m); const ug=c.clienti===rec.conteggi.clienti&&c.lavori===rec.conteggi.lavori&&c.documenti===rec.conteggi.documenti;
        passo("Conteggi",ug,`${c.clienti} clienti, ${c.lavori} lavori, ${c.documenti} documenti`+(ug?"":" (diversi da quelli registrati)")); }
    }
    let manc=0,alt=0;
    for(const hh of (rec.allegati||[])){ const a=await idbGet("allegati",hh); if(!a){manc++;continue;} const x=await sha256(await a.blob.arrayBuffer()); if(x!==hh) alt++; }
    if((rec.allegati||[]).length) passo("Documenti allegati",!manc&&!alt,manc||alt?`${manc} mancanti, ${alt} alterati`:`${rec.allegati.length} file presenti e integri`);
    rec.verifica={ts:adesso(),ok,dettagli:det};
    await idbPut("backup",rec);
    return rec.verifica;
  }catch(e){
    return {ts:adesso(),ok:false,dettagli:[...det,{lab:"Verifica",esito:false,msg:e.message}]};
  }
}
async function elencoBackup(){ return (await idbAll("backup")).sort((a,b)=>b.ts.localeCompare(a.ts)); }
async function potaBackup(){
  const tutti=await elencoBackup();
  const ultimoOk=tutti.find(b=>b.verifica?.ok);
  const cnt={};
  for(const b of tutti){
    const g=b.tipo==="automatico"||b.tipo==="manuale"?b.tipo:"sicurezza";
    cnt[g]=(cnt[g]||0)+1;
    if(cnt[g]>CONSERVA[g] && b!==ultimoOk) await idbDel("backup",b.id);
  }
  await raccogliAllegati();
}
async function raccogliAllegati(){
  const usati=new Set(allegatiInSospeso);
  docsTutti(db).forEach(x=>usati.add(x.hash));
  for(const b of await idbAll("backup")) (b.allegati||[]).forEach(h=>usati.add(h));
  for(const k of await idbKeys("allegati")) if(!usati.has(k)) await idbDel("allegati",k);
}
async function backupAutomaticoSeServe(motivo){
  if(!stato.idb||!db||stato.sola) return;
  const ult=(await elencoBackup()).find(b=>b.tipo==="automatico");
  if(!ult || giorniDa(ult.ts)>=0.83) await creaBackup("automatico",motivo);

/* ========================================================= ZIP (scrittura e lettura, senza librerie) */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();

  for(const f of files){
    const nome=enc.encode(f.nome), dati=typeof f.dati==="string"?enc.encode(f.dati):f.dati, crc=crc32(dati);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,tm,true); h.setUint16(12,dt,true); h.setUint32(14,crc,true); h.setUint32(18,dati.length,true); h.setUint32(22,dati.length,true);
    h.setUint16(26,nome.length,true); h.setUint16(28,0,true);
    parti.push(new Uint8Array(h.buffer),nome,dati);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,tm,true); c.setUint16(14,dt,true); c.setUint32(16,crc,true); c.setUint32(20,dati.length,true); c.setUint32(24,dati.length,true);
    c.setUint16(28,nome.length,true); c.setUint32(42,off,true);
    centrale.push(new Uint8Array(c.buffer),nome);
    off+=30+nome.length+dati.length;
  }
  const dim=centrale.reduce((s,p)=>s+p.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,dim,true); e.setUint32(16,off,true);
  return new Blob([...parti,...centrale,new Uint8Array(e.buffer)],{type:tipo});

async function leggiZip(u){

  if(e<0) throw new Error("Il file .zip non è leggibile");
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const out=[]; const dec=new TextDecoder();
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error("Il file .zip è danneggiato");
    const metodo=dv.getUint16(p+10,true), comp=dv.getUint32(p+20,true), ln=dv.getUint16(p+28,true), le=dv.getUint16(p+30,true), lc=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    const nome=dec.decode(u.subarray(p+46,p+46+ln)); p+=46+ln+le+lc;
    if(nome.endsWith("/")) continue;
    const start=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);
    const grezzo=u.subarray(start,start+comp);
    out.push({nome,metodo,leggi:async()=>{
      if(metodo===0) return grezzo;
      if(metodo===8&&"DecompressionStream" in window){ const s=new Blob([grezzo]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return new Uint8Array(await new Response(s).arrayBuffer()); }
      throw new Error("Questo .zip usa una compressione non supportata: estrai i file e carica archivio-completo.json");
    }});
  }
  return out;
}

/* ---- popover (filtri, avvisi, menu, ricerca) ---- */
function apriPopover(anchor,html,{focus=true,allinea="destra"}={}){
  const p=$("#popover"); p.innerHTML=html; p.hidden=false; p._anchor=anchor;
  const r=anchor.getBoundingClientRect(), w=p.offsetWidth;
  let left = allinea==="sinistra" ? r.left : r.right-w;
  p.style.left=Math.max(8,Math.min(left,window.innerWidth-w-8))+"px"; p.style.top=(r.bottom+8)+"px";
  if(allinea==="sinistra") p.style.minWidth=Math.min(r.width,640)+"px"; else p.style.minWidth="";
  anchor.setAttribute("aria-expanded","true");
  if(focus) setTimeout(()=>p.querySelector("button,select,input")?.focus(),10);
}
function chiudiPopover(){ const p=$("#popover"); if(p.hidden) return; p.hidden=true; p._anchor?.setAttribute("aria-expanded","false"); p._anchor=null; }
function popoverDi(el){ const p=$("#popover"); return !p.hidden && p._anchor && (p._anchor===el || p._anchor.id&&p._anchor.id===el.id); }
document.addEventListener("mousedown",e=>{ const p=$("#popover"); if(!p.hidden && !p.contains(e.target) && !(p._anchor&&p._anchor.contains(e.target))) chiudiPopover(); });
function avvisi(){
  if(!db) return [];
  const out=[];
  docAzAttivi().forEach(d=>{ const st=statoScadenzaDoc(d); if(st.k==="scaduto"||st.k==="scadenza") out.push({ico:"briefcase",cls:st.cls,t:`${d.categoria} ${st.k==="scaduto"?"scaduto":"in scadenza"}`,s:`Scadenza ${dataIt(d.scadenza)} · ${st.fra}`,hash:"azienda"}); });
  (stato.controlli?.voci||[]).filter(v=>v.livello!=="ok").forEach(v=>out.push({ico:"shield-alert",cls:v.livello==="errore"?"rosso":"arancio",t:v.titolo,s:v.testo,hash:"dati"}));
  db.clienti.filter(c=>!c.archiviato).forEach(c=>{ const sc=statoContratto(c); if(sc.k==="scaduto"||sc.k==="scadenza") out.push({ico:"clock",cls:sc.cls,t:`Contratto ${sc.txt.toLowerCase()}: ${nomeCliente(c)}`,s:`Scadenza ${dataIt(c.impianto.fine)}`,hash:`cliente/${c.id}/panoramica`}); });
  return out;
}
function risultatiRicerca(q){

const urlCopertine=new Map();
async function caricaCopertina(){
  const box=$("#copertina"); if(!box||!stato.idb) return;
  const c=clienteDa(box.dataset.id); if(!c) return;
  const img=c.documenti.filter(d=>!d.eliminato&&/^image\//.test(d.tipo)).sort((a,b)=>b.data.localeCompare(a.data))[0]; if(!img) return;
  let url=urlCopertine.get(img.hash);

}

/* ========================================================= VISTA: I MIEI CLIENTI */
let fc={q:"",tipo:"",contratto:"",stato:"attivi",incassare:false,ord:"nome",dir:1,pag:1};
const PER_PAGINA=10;
function clientiFiltrati(){
  const parole=norm(fc.q).split(/\s+/).filter(Boolean);
  const l=db.clienti.filter(c=>{
    if(fc.stato==="attivi"&&c.archiviato) return false;
    if(fc.stato==="archiviati"&&!c.archiviato) return false;
    if(fc.tipo&&c.descrizione!==fc.tipo) return false;
    if(fc.contratto){ const k=statoContratto(c).k; if(fc.contratto==="scadenza"?!(k==="scadenza"||k==="scaduto"):k!==fc.contratto) return false; }
    if(fc.incassare&&!(daIncassareCliente(c)>0)) return false;
    if(parole.length){ const t=norm([c.codice,nomeCliente(c),c.cognome,c.nome,c.referente,c.sede.indirizzo,c.sede.localita,c.tel,c.mobile1,c.mobile2,c.email,c.cf,c.piva,c.impianto.matricola,c.impianto.modello,c.impianto.fabbricante].join(" ")); if(!parole.every(p=>t.includes(p))) return false; }
    return true;
  });
  const chiave={nome:c=>norm(nomeCliente(c)),citta:c=>norm(c.sede.localita),lavori:c=>lavoriAttivi(c).length,ultima:c=>ultimoLavoro(c)?.data||""}[fc.ord]||(c=>norm(nomeCliente(c)));
  return l.sort((a,b)=>{ const x=chiave(a), y=chiave(b); return (x<y?-1:x>y?1:0)*fc.dir || norm(nomeCliente(a)).localeCompare(norm(nomeCliente(b))); });
}
function statoLista(c){
  if(c.archiviato) return {cls:"grigio",txt:"Archiviato"};
  const k=statoContratto(c).k;
  if(k==="scaduto") return {cls:"arancio",txt:"Scaduto"};
  if(k==="scadenza") return {cls:"arancio",txt:"In scadenza"};
  return {cls:"verde",txt:"Attivo"};
}
function pannelloLista(){

function indovinaCategoria(nome,tipo){
  const n=norm(nome);
  if(/rapport|\brti?\b/.test(n)) return "Rapporto tecnico";
  if(/conformit|\bdi\.?co\b/.test(n)) return "Dichiarazione di conformità";
  if(/librett/.test(n)) return "Libretto d'impianto";
  if(/fattur|invoice|ricevut/.test(n)) return "Fattura";
  if(/preventiv|offert/.test(n)) return "Preventivo";
  if(/contratt/.test(n)) return "Contratto";
  if(/^image\//.test(tipo||"")||/\.(jpe?g|png|heic|webp|gif)$/.test(n)) return "Foto";
  return "Altro";
}
const catDoc = d => d.categoria||indovinaCategoria(d.nome,d.tipo);
function indovinaTipoAzienda(nome){
  const n=norm(nome);
  if(/durc/.test(n)) return "DURC";
  if(/visura/.test(n)) return "Visura camerale";
  if(/polizz|assicuraz/.test(n)) return "Polizza RC";
  if(/f.?gas|patentino/.test(n)) return "Patentino F-gas";
  if(/37.?08|abilitaz/.test(n)) return "Abilitazione DM 37/08";
  if(/\bpsc\b|coordinament/.test(n)) return "PSC";
  if(/\bpos\b|piano operativ/.test(n)) return "POS";
  return "Altro";
}
const giorniA = s => Math.round((new Date(s+"T12:00")-new Date(oggi()+"T12:00"))/864e5);
function statoScadenzaDoc(d){
  if(!d.scadenza) return UNICI_AZIENDA.includes(d.categoria)&&d.categoria!=="Abilitazione DM 37/08" ? {k:"manca",cls:"grigio",txt:"Scadenza da inserire",fra:""} : {k:"nessuna",cls:"grigio",txt:"Senza scadenza",fra:""};
  const g=giorniA(d.scadenza);
  const fra = g<0 ? `scaduto da ${-g} ${-g===1?"giorno":"giorni"}` : g===0 ? "scade oggi" : `tra ${g} ${g===1?"giorno":"giorni"}`;
  if(g<0) return {k:"scaduto",cls:"rosso",txt:"Scaduto",fra};
  if(g<=30) return {k:"scadenza",cls:"arancio",txt:"In scadenza",fra};
  return {k:"valido",cls:"verde",txt:"Valido",fra};
}

/* Copia il file nell'archivio e controlla che la copia salvata sia identica (stessa impronta). */
async function archiviaBlob(f){
  const buf=await f.arrayBuffer(); const hash=await sha256(buf);
  allegatiInSospeso.add(hash);
  if(!await idbGet("allegati",hash)) await idbPut("allegati",{hash,blob:new Blob([buf],{type:f.type||"application/octet-stream"}),tipo:f.type,dimensione:f.size,nome:f.name});
  const letto=await idbGet("allegati",hash); if(!letto) throw new Error("il file non risulta salvato");
  if(await sha256(await letto.blob.arrayBuffer())!==hash) throw new Error("la copia salvata non è identica all'originale");
  return hash;
}
async function aggiungiDocumenti(c,files,lavoroId=null,salvaSubito=true,opz={}){
  if(!stato.idb){ toast("Questo browser non permette di archiviare documenti","err"); return []; }
  const nuovi=[], esito=opz.esito||{doppioni:[],errori:[]};
  for(const voce of files){
    const f=voce.file||voce, percorso=voce.percorso||"";
    if(f.size>MAX_DOC){ esito.errori.push({nome:f.name,motivo:"supera i 25 MB"}); if(!opz.riepilogo) toast(`«${f.name}» supera i 25 MB e non è stato caricato`,"err"); opz.avanzamento?.(); continue; }
    try{
      const hash=await archiviaBlob(f);
      if(opz.saltaDoppioni&&c.documenti.some(x=>x.hash===hash&&!x.eliminato)){ esito.doppioni.push(f.name); opz.avanzamento?.(); continue; }
      const d={id:uid(),nome:f.name,tipo:f.type||"",dimensione:f.size,hash,data:adesso(),descrizione:"",lavoroId,caricatoDa:nomeOp(),eliminato:false,categoria:opz.categoria||indovinaCategoria(f.name,f.type),percorso};
      c.documenti.push(d); nuovi.push(d);
      if(!opz.riepilogo) registra("documento","Documento caricato",`${f.name} (${formatoByte(f.size)}, ${d.categoria}) per ${nomeCliente(c)}`,{clienteId:c.id,riferimento:d.id});
    }catch(e){ esito.errori.push({nome:f.name,motivo:e.message}); if(!opz.riepilogo) toast(`«${f.name}» non è stato caricato: ${e.message}`,"err"); }
    opz.avanzamento?.();
  }
  if(salvaSubito&&nuovi.length){ await salva(); if(!opz.riepilogo) toast(nuovi.length===1?"Documento archiviato":`${nuovi.length} documenti archiviati`); }
  setTimeout(()=>allegatiInSospeso.clear(),3000);
  return nuovi;
}
async function aggiungiDocAzienda(voci,opz={}){
  if(!stato.idb){ toast("Questo browser non permette di archiviare documenti","err"); return []; }
  const nuovi=[], esito=opz.esito||{doppioni:[],errori:[]};
  for(const v of voci){
    const f=v.file||v;
    try{
      if(f.size>MAX_DOC) throw new Error("supera i 25 MB");
      const hash=await archiviaBlob(f);
      if(db.azienda.documenti.some(x=>x.hash===hash&&!x.eliminato)){ esito.doppioni.push(f.name); opz.avanzamento?.(); continue; }
      const tipoAz=opz.tipo||indovinaTipoAzienda(f.name);
      const d={id:uid(),nome:f.name,tipo:f.type||"",dimensione:f.size,hash,data:adesso(),caricatoDa:nomeOp(),eliminato:false,categoria:tipoAz,rilascio:opz.rilascio||"",scadenza:opz.scadenza||"",nota:opz.nota||"",percorso:v.percorso||"",sostituitoDa:null};
      if(opz.sost){ const x=db.azienda.documenti.find(y=>y.id===opz.sost); if(x) x.sostituitoDa=d.id; }
      else if(opz.tipo&&UNICI_AZIENDA.includes(tipoAz)) docAzAttivi().filter(x=>x.categoria===tipoAz).forEach(x=>x.sostituitoDa=d.id);
      db.azienda.documenti.push(d); nuovi.push(d);
    }catch(e){ esito.errori.push({nome:f.name,motivo:e.message}); }
    opz.avanzamento?.();
  }
  if(nuovi.length) registra("azienda",opz.tipo?"Documento aziendale caricato":"Cartella importata",
    opz.tipo?`${opz.tipo}: ${nuovi[0].nome}${opz.scadenza?` · scadenza ${dataIt(opz.scadenza)}`:""}`:`${nuovi.length} documenti dell'azienda (${formatoByte(nuovi.reduce((s,d)=>s+d.dimensione,0))})`);
  setTimeout(()=>allegatiInSospeso.clear(),3000);
  return nuovi;
}
async function blobDoc(id){
  const c=clienteDa(vista.id); const d=c?.documenti.find(x=>x.id===id)||db.azienda.documenti.find(x=>x.id===id); if(!d) return null;
  const a=await idbGet("allegati",d.hash); return a?{d,blob:a.blob}:{d,blob:null};
}

/* ---- portare dentro una cartella intera ---- */
function vociDaInput(files){ return [...files].map(f=>({file:f,percorso:(f.webkitRelativePath||"").split("/").slice(0,-1).join("/")})); }
async function vociDaTrascinamento(dt){
  const entries=[...(dt.items||[])].map(i=>i.webkitGetAsEntry?.()).filter(Boolean);
  if(!entries.length) return {voci:[...dt.files].map(f=>({file:f,percorso:""})),cartella:false};
  const out=[];
  const leggi=dir=>new Promise((res,rej)=>{ const r=dir.createReader(), tutte=[]; const passo=()=>r.readEntries(b=>{ if(!b.length) res(tutte); else { tutte.push(...b); passo(); } },rej); passo(); });
  const giro=async(e,perc)=>{
    if(e.isFile){ const f=await new Promise((res,rej)=>e.file(res,rej)); out.push({file:f,percorso:perc}); }
    else if(e.isDirectory){ const p=perc?perc+"/"+e.name:e.name; for(const x of await leggi(e)) await giro(x,p); }
  };
  for(const e of entries) await giro(e,"");
  return {voci:out,cartella:entries.some(e=>e.isDirectory)};
}

  const chi = dest.tipo==="azienda" ? "nei <b>documenti dell'azienda</b>" : `nei documenti di <b>${esc(nomeCliente(clienteDa(dest.id)))}</b>`;

    <div class="avviso blu">${ic("shield-ok")}<div class="corpo"><b>I file sul computer restano dove sono e come sono.</b> Il programma ne fa una copia, calcola per ciascuno un'impronta digitale e controlla che la copia sia identica. I file già presenti non vengono duplicati.</div></div>
    ${spazio}
    ${saltati.length?`<details class="doc"><summary>${saltati.length} ${saltati.length===1?"file non verrà copiato":"file non verranno copiati"}</summary><ul class="saltati">${saltati.slice(0,80).map(x=>`<li>${esc(x.nome)}: ${esc(x.motivo)}</li>`).join("")}</ul></details>`:""}

async function importaCartella(){
  const att=stato.cartellaInAttesa; stato.cartellaInAttesa=null; if(!att) return;
  const {voci,dest}=att, tot=voci.length; let fatti=0;
  apriModale(`${testaModale("Copia in corso…")}<p id="avCart" aria-live="polite" style="margin-top:0">0 di ${tot} file copiati e verificati</p><div class="barra-av"><span id="avBarra" style="width:0%"></span></div><p class="muto piccolo-t">Lascia aperta questa finestra finché non ha finito.</p>`,{bloccante:true});
  const passo=()=>{ fatti++; const p=$("#avCart"); if(p) p.textContent=`${fatti} di ${tot} file copiati e verificati`; const b=$("#avBarra"); if(b) b.style.width=(fatti/tot*100).toFixed(1)+"%"; };
  const esito={doppioni:[],errori:[]}; let nuovi=[];
  if(dest.tipo==="azienda") nuovi=await aggiungiDocAzienda(voci,{esito,avanzamento:passo});
  else {
    const c=clienteDa(dest.id);
    nuovi=await aggiungiDocumenti(c,voci,null,false,{riepilogo:true,saltaDoppioni:true,esito,avanzamento:passo});
    if(nuovi.length) registra("documento","Cartella importata",`${nuovi.length} documenti (${formatoByte(nuovi.reduce((s,d)=>s+d.dimensione,0))}) per ${nomeCliente(c)}`,{clienteId:c.id});
  }
  if(nuovi.length) await salva();
  const okS=stato.salv.ok!==false, pieno=okS&&!esito.errori.length;
  apriModale(`${testaModale(okS?"Fatto":"Salvataggio non riuscito")}
    <div class="esito-cart"><div class="cerchio-ok ${pieno?"":"att"}">${ic(pieno?"check":"esclamativo")}</div>
    <p style="margin:0"><b>${nuovi.length} ${nuovi.length===1?"documento copiato e verificato":"documenti copiati e verificati"}</b>${esito.doppioni.length?`<br><span class="muto">${esito.doppioni.length===1?"1 era già presente e non è stato duplicato":`${esito.doppioni.length} erano già presenti e non sono stati duplicati`}</span>`:""}${esito.errori.length?`<br><span style="color:var(--rosso)">${esito.errori.length} non copiati: vedi sotto</span>`:""}</p></div>

  render();
}

    chiudiModale(); await salva(); toast(`${v.tipo} archiviato${v.scadenza?`: scade il ${dataIt(v.scadenza)}`:""}`); render();
  };
}

  ${lista.length?lista.slice(0,500).map(({l,c})=>`<tr class="clic" data-az="nav" data-hash="cliente/${c.id}/lavori/${l.id}" tabindex="0">
    <td style="white-space:nowrap">${dataIt(l.data)}</td><td><b>${esc(nomeCliente(c))}</b><span class="sec">${esc(c.sede.localita)}</span></td>

    <td class="num">${l.costo!==""?euro(l.costo):"—"}</td><td>${l.costo===""||l.stato==="Annullata"?'<span class="muto">—</span>':daPagare(l)>0?`<span class="badge rosso">da pagare ${euro(daPagare(l))}</span>`:'<span class="badge verde">pagato</span>'}</td></tr>`).join("")

const SEZ_DATI=[["panoramica","Panoramica"],["backup","Backup"],["esporta","Esporta"],["ripristino","Ripristino"],["registro","Registro modifiche"],["accesso","Accesso e autonomia"]];

function anelloStato(){
  const k=stato.controlli?.complessivo||"attesa", voci=stato.controlli?.voci||[];
  const r=78, C=2*Math.PI*r, n=5, gap=6, seg=C/n-gap;
  const col={ok:"#1b7a43",attenzione:"#d9861c",errore:"#b42f2f"};
  const archi=Array.from({length:n},(_,i)=>{ const v=voci[i]; return `<circle cx="100" cy="100" r="${r}" fill="none" stroke="${v?col[v.livello]:"#d5dce4"}" stroke-width="14" stroke-dasharray="${seg} ${C-seg}" stroke-dashoffset="${-(i*C/n)-gap/2}" stroke-linecap="butt"/>`; }).join("");
  const superati=voci.filter(v=>v.livello==="ok").length;
  const etich={ok:"Protetto e verificato",attenzione:"Richiede attenzione",rischio:"A rischio",attesa:"Verifica in corso"}[k];
  const icona={ok:"shield-ok",attenzione:"shield-alert",rischio:"shield-alert",attesa:"shield"}[k];

    <div class="centro">${ic(icona)}<b>${etich}</b><small>${voci.length?`${superati} su ${n} controlli`:"…"}</small></div></div>`;
}

function registraEsportazione(nome,dim,cosa){

async function costruisciEsportazioneCompleta(){
  const t=tabelle(), radice=`gestionale-archivio-${oggi()}`, files=[], mappa={}, usati=new Set(), fatti=new Set(); let mancanti=0;
  for(const {d,cart} of docsConCartella()){
    const a=stato.idb?await idbGet("allegati",d.hash):null; if(!a){ mancanti++; continue; }
    if(fatti.has(d.hash+"|"+cart)) continue; fatti.add(d.hash+"|"+cart);
    let p=`documenti/${nomeFileSicuro(cart)}/${(d.data||"").slice(0,10)} ${nomeFileSicuro(d.nome)}`;
    let i=2; while(usati.has(p)){ p=p.replace(/(\.[^./]+)?$/,m=>` (${i})`+m); i++; } usati.add(p);
    files.push({nome:`${radice}/${p}`,dati:new Uint8Array(await a.blob.arrayBuffer())}); if(!mappa[d.hash]) mappa[d.hash]=p;
  }
  const arch=senzaCredenziali(db); arch._esportazione={ts:adesso(),appVersion:APP_VERSION,schema:SCHEMA,fileDocumenti:mappa,nota:"I PIN non sono inclusi. I percorsi dei documenti sono relativi a questa cartella."};
  files.unshift(
    {nome:`${radice}/LEGGIMI.txt`,dati:testoLeggimi()},
    {nome:`${radice}/archivio-completo.json`,dati:JSON.stringify(arch,null,1)},
    {nome:`${radice}/dati/clienti.csv`,dati:csv(t.clienti)},
    {nome:`${radice}/dati/lavorazioni.csv`,dati:csv(t.lavorazioni)},
    {nome:`${radice}/dati/note.csv`,dati:csv(t.note)},
    {nome:`${radice}/dati/documenti.csv`,dati:csv(t.documenti)},
    {nome:`${radice}/dati/registro-modifiche.csv`,dati:csv(t.registro)},
    {nome:`${radice}/dati/gestionale.xlsx`,dati:new Uint8Array(await creaXlsx([{nome:"Clienti",righe:t.clienti},{nome:"Lavorazioni",righe:t.lavorazioni},{nome:"Note",righe:t.note},{nome:"Documenti",righe:t.documenti},{nome:"Registro modifiche",righe:t.registro}]).arrayBuffer())}
  );
  return {blob:creaZip(files),nome:`${radice}.zip`,mancanti,nFile:files.length};
}

async function esportaSingola(cosa,fmt){
  const t=tabelle(), oggiS=oggi(); let nome, blob;
  if(fmt==="csv"){ nome=`${cosa}-${oggiS}.csv`; blob=new Blob([csv(t[cosa])],{type:"text/csv;charset=utf-8"}); }
  else if(fmt==="xlsx"){ nome=`${cosa}-${oggiS}.xlsx`; blob=creaXlsx([{nome:cosa[0].toUpperCase()+cosa.slice(1),righe:t[cosa]}]); }
  else {
    let dati;
    if(cosa==="clienti") dati=db.clienti.map(c=>{ const {lavori,documenti,noteDiario,...resto}=c; return resto; });
    else if(cosa==="lavorazioni") dati=db.clienti.flatMap(c=>c.lavori.map(l=>({clienteId:c.id,cliente:nomeCliente(c),codiceCliente:c.codice,...l})));
    nome=`${cosa}-${oggiS}.json`; blob=new Blob([JSON.stringify({schema:SCHEMA,esportato:adesso(),[cosa]:dati},null,1)],{type:"application/json"});
  }
  scarica(nome,blob); registraEsportazione(nome,blob.size,`Esportazione ${cosa} (${fmt.toUpperCase()})`); toast(`${nome} scaricato`);
}
async function esportaDocumenti(){
  const files=[], t=tabelle(), usati=new Set();
  for(const {d,cart} of docsConCartella().filter(x=>!x.d.eliminato)){
    const a=await idbGet("allegati",d.hash); if(!a) continue;
    let p=`documenti/${nomeFileSicuro(cart)}/${nomeFileSicuro(d.nome)}`; let i=2; while(usati.has(p)){ p=p.replace(/(\.[^./]+)?$/,m=>` (${i})`+m); i++; } usati.add(p);
    files.push({nome:p,dati:new Uint8Array(await a.blob.arrayBuffer())});
  }
  if(!files.length){ toast("Non ci sono documenti da esportare","err"); return; }
  files.push({nome:"documenti.csv",dati:csv(t.documenti)});
  const nome=`documenti-${oggi()}.zip`, blob=creaZip(files); scarica(nome,blob); registraEsportazione(nome,blob.size,"Esportazione documenti"); toast(`${files.length-1} documenti esportati`);
}
async function backupSuFile(){
  const arch=senzaCredenziali(db); arch._allegati={};
  for(const d of docsTutti(db)){ if(arch._allegati[d.hash]) continue; const a=stato.idb?await idbGet("allegati",d.hash):null; if(a) arch._allegati[d.hash]={nome:d.nome,tipo:d.tipo,base64:bufToB64(await a.blob.arrayBuffer())}; }
  const nome=`backup-gestionale-${oggi()}.json`, blob=new Blob([JSON.stringify(arch)],{type:"application/json"});
  scarica(nome,blob);
  db.eventi.ultimoBackupEsterno={ts:adesso(),tipo:"file .json",file:nome};
  registra("dati","Copia scaricata",`${nome} (${formatoByte(blob.size)})`);
  if(stato.salv.ok!==false) await salva();
  toast("Copia completa scaricata");
  eseguiControlli(false);
}

/* ========================================================= RIPRISTINO */
async function leggiFileCandidato(file){
  const u=new Uint8Array(await file.arrayBuffer());
  if(u[0]===0x50&&u[1]===0x4b){
    const voci=await leggiZip(u);
    const j=voci.find(v=>/(^|\/)archivio-(completo|corrente)\.json$/.test(v.nome));
    if(!j) throw new Error("Questo .zip non contiene un archivio del gestionale (manca archivio-completo.json)");
    const dati=JSON.parse(new TextDecoder().decode(await j.leggi()));
    const mappa=dati._esportazione?.fileDocumenti||{}; delete dati._esportazione;
    return {origine:`file ${file.name}`,dati,allegati:async h=>{ const p=mappa[h]; const v=p&&voci.find(x=>x.nome===p||x.nome.endsWith("/"+p)); return v?new Blob([await v.leggi()]):null; }};
  }
  let dati; try{ dati=JSON.parse(new TextDecoder().decode(u)); }catch(e){ throw new Error("Il file non è una copia del gestionale (non è un JSON leggibile)"); }

async function eseguiRipristino(cand,nuovo){

    } else segna("sicurezza","ok","Archivio vuoto: niente da mettere da parte");
    corrente="documenti"; segna("documenti","corso");
    let rec=0, manc=0;
    if(stato.idb){
      for(const h of new Set(docsTutti(nuovo).map(d=>d.hash))){
        if(await idbGet("allegati",h)){ rec++; continue; }
        const bl=await cand.allegati(h); if(!bl){ manc++; continue; }
        const buf=await bl.arrayBuffer(); if(await sha256(buf)!==h){ manc++; continue; }
        allegatiInSospeso.add(h);
        const d=docsTutti(nuovo).find(x=>x.hash===h);
        await idbPut("allegati",{hash:h,blob:new Blob([buf],{type:d?.tipo||""}),tipo:d?.tipo||"",dimensione:buf.byteLength,nome:d?.nome||""}); rec++;
      }
    }
    segna("documenti",manc?"errore":"ok",`${rec} documenti presenti e integri${manc?`, ${manc} mancanti`:""}`);
    corrente="applica"; segna("applica","corso");
    const vergine=archivioVergine();
    if(db&&!vergine){ nuovo.utenti=db.utenti; nuovo.recupero=db.recupero; nuovo.eventi=db.eventi; }
    const ids=new Set((db?.registro||[]).map(r=>r.id));
    nuovo.registro=[...(db?.registro||[]),...nuovo.registro.filter(r=>!ids.has(r.id))].sort((a,b)=>a.ts.localeCompare(b.ts));
    const atteso=contaTutto(nuovo);
    db=nuovo;
    if(!db.utenti.some(u=>u.id===sessione.utente?.id)) sessione.utente=db.utenti.find(u=>u.ruolo==="admin"&&u.attivo!==false);
    registra("dati","Ripristino",`Dati ripristinati da ${cand.origine}: ${atteso.clienti} clienti, ${atteso.lavori} lavori, ${atteso.documenti} documenti`);
    const okS=await salva(); if(!okS) throw new Error("Il salvataggio dei dati ripristinati non è riuscito");
    segna("applica","ok");
    corrente="verifica"; segna("verifica","corso");
    const riletto=JSON.parse(stato.idb?await idbGet("kv","archivio"):lsGet(CHIAVE_LS)); const c2=contaTutto(riletto);
    if(c2.clienti!==atteso.clienti||c2.lavori!==atteso.lavori||c2.documenti!==atteso.documenti) throw new Error("I conteggi riletti non corrispondono a quelli attesi");
    segna("verifica","ok",`${c2.clienti} clienti, ${c2.lavori} lavori, ${c2.documenti} documenti: corrispondono`);
    $("#esitoR").innerHTML=`<div class="avviso verde" style="margin-top:16px">${ic("check-c")}<div class="corpo"><b>Ripristino completato e verificato.</b>Se vuoi tornare alla situazione di prima, trovi la copia di sicurezza in I miei dati › Backup.</div></div><div class="modale-piede"><button class="btn primario" id="fineR">Continua</button></div>`;
    $("#fineR").onclick=()=>{ chiudiModale(); avviaApp(); vai("clienti"); eseguiControlli(false); };
  }catch(e){
    segna(corrente,"errore",e.message);
    const integro = corrente==="sicurezza"||corrente==="documenti";
    $("#esitoR").innerHTML=`<div class="avviso rosso" style="margin-top:16px">${ic("alert")}<div class="corpo"><b>Il ripristino non è stato completato.</b>${esc(e.message)}. ${integro?"I tuoi dati attuali non sono stati modificati.":"Puoi tornare allo stato precedente dalla copia di sicurezza in I miei dati › Backup."}</div></div><div class="modale-piede"><button class="btn primario" id="fineR">Chiudi</button></div>`;
    $("#fineR").onclick=()=>{ chiudiModale(); if(db&&sessione.utente) render(); };
  }

async function hashPin(pin,salt){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64ToBuf(salt),iterations:150000,hash:"SHA-256"},k,256);
  return bufToB64(bits);
}
